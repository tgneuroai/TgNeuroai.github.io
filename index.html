<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DystoPunks — প্রিমিয়াম NFT গ্যালারি</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================
                   প্রিমিয়াম ডিজাইন — DystoPunks গ্যালারি
                   ============================================ */

        /* ----- রিসেট ও বেস ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #070b10;
            color: #eef2f8;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(30, 60, 120, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(60, 30, 120, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 20, 40, 0.8) 0%, #070b10 100%);
            padding: 0;
        }

        /* ----- স্ক্রলবার স্টাইল ----- */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1620;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a50;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f7dff;
        }

        /* ----- কন্টেইনার ----- */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem 2rem 3rem;
        }

        /* ===== হেডার (প্রিমিয়াম) ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #4f7dff, #7aa9ff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 30px rgba(79, 125, 255, 0.25);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 30%, #7aa9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .header-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #8aa3c9;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .header-stats .stat-item i {
            color: #4f7dff;
            font-size: 0.9rem;
        }

        .header-stats .stat-item .num {
            color: #fff;
            font-weight: 600;
        }

        /* ===== ফিল্টার / সার্চ বার ===== */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 400px;
        }

        .search-box:focus-within {
            border-color: #4f7dff;
            box-shadow: 0 0 30px rgba(79, 125, 255, 0.08);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-box i {
            color: #5a7395;
            font-size: 0.9rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 0.7rem 0.8rem;
            color: #eef2f8;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #4a6385;
        }

        .search-box button {
            background: linear-gradient(135deg, #4f7dff, #3b62d9);
            border: none;
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-box button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(79, 125, 255, 0.3);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-tags .tag {
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8aa3c9;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-tags .tag:hover {
            background: rgba(79, 125, 255, 0.15);
            border-color: #4f7dff;
            color: #fff;
        }

        .filter-tags .tag.active {
            background: rgba(79, 125, 255, 0.2);
            border-color: #4f7dff;
            color: #fff;
        }

        /* ===== প্রগ্রেস বার ===== */
        .progress-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            height: 4px;
            margin-bottom: 0.8rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f7dff, #7aa9ff, #b0d0ff);
            border-radius: 40px;
            transition: width 0.4s ease;
        }

        .progress-text {
            text-align: right;
            font-size: 0.75rem;
            color: #5a7395;
            margin-bottom: 1.8rem;
            letter-spacing: 0.3px;
        }

        .progress-text i {
            margin-right: 0.3rem;
        }

        /* ===== গ্রিড ===== */
        .nft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        /* ===== কার্ড (প্রিমিয়াম) ===== */
        .nft-card {
            background: linear-gradient(145deg, rgba(20, 30, 45, 0.9), rgba(12, 18, 28, 0.95));
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            position: relative;
        }

        .nft-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(79, 125, 255, 0.2), transparent, rgba(79, 125, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .nft-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(79, 125, 255, 0.3);
            box-shadow: 0 20px 60px rgba(30, 60, 150, 0.25);
        }

        /* ===== মিডিয়া র‍্যাপার ===== */
        .media-wrapper {
            background: #0a0f16;
            position: relative;
            padding-top: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-wrapper img,
        .media-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0f16;
            transition: transform 0.5s ease;
        }

        .nft-card:hover .media-wrapper img,
        .nft-card:hover .media-wrapper video {
            transform: scale(1.03);
        }

        .media-wrapper video {
            object-fit: cover;
        }

        /* GIF ব্যাজ */
        .media-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #b0d0ff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
        }

        .media-badge i {
            margin-right: 0.2rem;
        }

        /* ===== কার্ড ইনফো ===== */
        .nft-info {
            padding: 1.2rem 1.3rem 1.4rem;
            background: linear-gradient(180deg, rgba(18, 26, 38, 0.9), rgba(12, 18, 28, 0.95));
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nft-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #eef2f8;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nft-name .token-id {
            font-size: 0.7rem;
            font-weight: 500;
            color: #5a7395;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .attributes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.4rem;
            margin-top: 0.2rem;
        }

        .trait {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #b6cdff;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            letter-spacing: 0.2px;
        }

        .trait-type {
            color: #6a84aa;
            font-weight: 400;
        }

        .trait-value {
            color: #dce8ff;
            font-weight: 500;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.6rem;
            color: #5a7395;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-footer .format {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card-footer .format i {
            font-size: 0.7rem;
        }

        /* ===== লোডিং প্লেসহোল্ডার ===== */
        .loading-placeholder {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: #5a7395;
        }

        .loading-placeholder .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top-color: #4f7dff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-placeholder .main-text {
            font-size: 1.1rem;
            color: #8aa3c9;
        }

        .loading-placeholder .sub-text {
            font-size: 0.85rem;
            color: #4a6385;
            margin-top: 0.3rem;
        }

        /* ===== এনিমেশন ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nft-card {
            animation: fadeUp 0.5s ease forwards;
        }

        /* ===== রেসপন্সিভ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }
            .header-left {
                justify-content: center;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header-stats {
                justify-content: center;
                padding: 0.4rem 1rem;
                flex-wrap: wrap;
            }
            .header-stats .stat-item {
                font-size: 0.7rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                max-width: 100%;
            }
            .filter-tags {
                justify-content: center;
            }
            .nft-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.2rem;
            }
            .nft-name {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .nft-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 0.8rem;
            }
            .nft-info {
                padding: 0.8rem;
            }
            .trait {
                font-size: 0.55rem;
                padding: 0.15rem 0.5rem;
            }
            .nft-name {
                font-size: 0.8rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== হেডার ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo-icon"><i class="fas fa-cube"></i></div>
            <h1>DystoPunks</h1>
        </div>
        <div class="header-stats">
            <span class="stat-item">
                <i class="fas fa-image"></i>
                <span class="num" id="totalCount">0</span> / 2076
            </span>
            <span class="stat-item">
                <i class="fas fa-film"></i>
                <span class="num" id="gifCount">0</span> GIF
            </span>
            <span class="stat-item">
                <i class="fas fa-file-image"></i>
                <span class="num" id="pngCount">0</span> PNG
            </span>
        </div>
    </header>

    <!-- ===== টুলবার ===== -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="NFT খুঁজুন (নাম বা আইডি)..." />
            <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
        </div>
        <div class="filter-tags">
            <button class="tag active" data-filter="all">সব</button>
            <button class="tag" data-filter="gif">🎞️ GIF</button>
            <button class="tag" data-filter="png">🖼️ PNG</button>
        </div>
    </div>

    <!-- ===== প্রগ্রেস ===== -->
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">
        <i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...
    </div>

    <!-- ===== গ্রিড ===== -->
    <div id="nftGrid" class="nft-grid">
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <div class="main-text">NFT গুলো লোড হচ্ছে</div>
            <div class="sub-text">মেটাডাটা থেকে ছবি আনা হচ্ছে...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ============================================================
        //  কনফিগারেশন
        // ============================================================
        const TOTAL = 2076;
        const BASE_URL = 'https://dystopunks.mypinata.cloud/ipfs/QmeYQ2eDCcJpfBQHq59P7SNevQR2ycEfctn6waw8fZBJhK/';
        const CONCURRENCY = 25;

        // ============================================================
        //  DOM রেফারেন্স
        // ============================================================
        const grid = document.getElementById('nftGrid');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const totalCount = document.getElementById('totalCount');
        const gifCount = document.getElementById('gifCount');
        const pngCount = document.getElementById('pngCount');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const filterTags = document.querySelectorAll('.filter-tags .tag');

        // ============================================================
        //  স্টেট
        // ============================================================
        let allCards = [];          // { element, tokenId, name, format, attributes }
        let loadedCount = 0;
        let gifTotal = 0;
        let pngTotal = 0;
        let currentFilter = 'all';
        let searchQuery = '';

        // ============================================================
        //  হেল্পার: ফাইল এক্সটেনশন (URL থেকে)
        // ============================================================
        function getExtension(url) {
            if (!url) return '';
            try {
                const path = new URL(url).pathname;
                const parts = path.split('.');
                return parts.length > 1 ? parts.pop().toLowerCase() : '';
            } catch {
                // URL পার্স না হলে স্ট্রিং থেকে বের করার চেষ্টা
                const match = url.match(/\.([^./?#]+)(?:[?#]|$)/);
                return match ? match[1].toLowerCase() : '';
            }
        }

        // ============================================================
        //  মিডিয়া এলিমেন্ট তৈরি (PNG / GIF)
        // ============================================================
        function createMedia(imageUrl, altText) {
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';

            const ext = getExtension(imageUrl);

            // GIF চিহ্নিত করলে ভিডিও, নাহলে ইমেজ
            if (ext === 'gif') {
                const video = document.createElement('video');
                video.src = imageUrl;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.setAttribute('aria-label', altText);
                wrapper.appendChild(video);

                // GIF ব্যাজ
                const badge = document.createElement('div');
                badge.className = 'media-badge';
                badge.innerHTML = '<i class="fas fa-play"></i> GIF';
                wrapper.appendChild(badge);
            } else {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = altText;
                img.loading = 'lazy';
                img.decoding = 'async';
                // ইমেজ লোড না হলে প্লেসহোল্ডার
                img.onerror = function() {
                    this.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.style.cssText = 'position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#0b1118; color:#4a6385; font-size:2rem;';
                    fallback.innerHTML = '<i class="fas fa-image" style="opacity:0.3;"></i>';
                    this.parentNode.appendChild(fallback);
                };
                wrapper.appendChild(img);
            }
            return wrapper;
        }

        // ============================================================
        //  অ্যাট্রিবিউট রেন্ডার
        // ============================================================
        function renderAttrs(attrs) {
            if (!attrs || attrs.length === 0) {
                return `<span class="trait"><span class="trait-type">—</span> <span class="trait-value">কোনো অ্যাট্রিবিউট নেই</span></span>`;
            }
            // বেশি অ্যাট্রিবিউট থাকলে ৪টার বেশি দেখাবো না
            const displayAttrs = attrs.slice(0, 6);
            return displayAttrs.map(a => {
                const type = a.trait_type || 'বৈশিষ্ট্য';
                const value = a.value || '—';
                return `<span class="trait"><span class="trait-type">${type}:</span> <span class="trait-value">${value}</span></span>`;
            }).join('');
        }

        // ============================================================
        //  একক NFT কার্ড তৈরি (ফেচ সহ)
        // ============================================================
        function fetchAndBuildCard(index) {
            const tokenId = index + 1;
            const url = `${BASE_URL}${tokenId}`;

            return fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    const imageUrl = data.image || '';
                    const name = data.name || `DystoPunk #${tokenId}`;
                    const attrs = data.attributes || [];

                    const ext = getExtension(imageUrl);
                    const format = ext === 'gif' ? 'gif' : 'png';

                    // কার্ড এলিমেন্ট
                    const card = document.createElement('div');
                    card.className = 'nft-card';
                    card.dataset.tokenId = tokenId;
                    card.dataset.format = format;
                    card.dataset.name = name.toLowerCase();

                    // মিডিয়া
                    const media = createMedia(imageUrl, name);
                    card.appendChild(media);

                    // ইনফো
                    const info = document.createElement('div');
                    info.className = 'nft-info';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'nft-name';
                    nameDiv.innerHTML = `
                        ${name}
                        <span class="token-id">#${tokenId}</span>
                    `;
                    info.appendChild(nameDiv);

                    const attrDiv = document.createElement('div');
                    attrDiv.className = 'attributes';
                    attrDiv.innerHTML = renderAttrs(attrs);
                    info.appendChild(attrDiv);

                    // ফুটার
                    const footer = document.createElement('div');
                    footer.className = 'card-footer';
                    const formatLabel = format === 'gif' ? 'GIF' : 'PNG';
                    const formatIcon = format === 'gif' ? 'fa-film' : 'fa-file-image';
                    footer.innerHTML = `
                        <span class="format"><i class="fas ${formatIcon}"></i> ${formatLabel}</span>
                        <span>${attrs.length} টি অ্যাট্রিবিউট</span>
                    `;
                    info.appendChild(footer);

                    card.appendChild(info);

                    // স্টেটে সংরক্ষণের জন্য ডেটা
                    return {
                        element: card,
                        tokenId: tokenId,
                        name: name,
                        format: format,
                        attributes: attrs
                    };
                })
                .catch(err => {
                    console.warn(`#${tokenId} লোড ব্যর্থ:`, err);
                    // ফallback কার্ড
                    const fallback = document.createElement('div');
                    fallback.className = 'nft-card';
                    fallback.dataset.tokenId = tokenId;
                    fallback.dataset.format = 'error';
                    fallback.style.borderColor = 'rgba(200,80,80,0.2)';
                    fallback.innerHTML = `
                        <div class="media-wrapper" style="background:#0f1620; display:flex; align-items:center; justify-content:center; color:#4a6385;">
                            <i class="fas fa-exclamation-triangle" style="font-size:2.5rem; opacity:0.3;"></i>
                        </div>
                        <div class="nft-info">
                            <div class="nft-name">
                                DystoPunk #${tokenId}
                                <span class="token-id">#${tokenId}</span>
                            </div>
                            <div class="attributes"><span class="trait" style="background:rgba(255,255,255,0.03);">মেটাডাটা লোড হয়নি</span></div>
                            <div class="card-footer">
                                <span class="format"><i class="fas fa-ban"></i> Error</span>
                                <span>—</span>
                            </div>
                        </div>
                    `;
                    return {
                        element: fallback,
                        tokenId: tokenId,
                        name: `DystoPunk #${tokenId}`,
                        format: 'error',
                        attributes: []
                    };
                });
        }

        // ============================================================
        //  ফিল্টার ও সার্চ ফাংশন
        // ============================================================
        function applyFilters() {
            const query = searchQuery.toLowerCase().trim();
            const filter = currentFilter;

            let visibleCount = 0;
            let visibleGif = 0;
            let visiblePng = 0;

            allCards.forEach(item => {
                const card = item.element;
                const format = item.format;
                const nameMatch = item.name.toLowerCase().includes(query) || String(item.tokenId).includes(query);
                const formatMatch = filter === 'all' || filter === format;

                const show = nameMatch && formatMatch;
                card.style.display = show ? 'flex' : 'none';
                if (show) {
                    visibleCount++;
                    if (format === 'gif') visibleGif++;
                    else if (format === 'png') visiblePng++;
                }
            });

            // আপডেট স্ট্যাটাস
            progressText.innerHTML = `
                <i class="fas fa-eye"></i> 
                ${visibleCount} টি দেখানো হচ্ছে 
                <span style="color:#4a6385; margin-left:0.5rem;">
                    (GIF: ${visibleGif} · PNG: ${visiblePng})
                </span>
            `;
        }

        // ============================================================
        //  সবগুলো লোড করা (কনকারেন্ট ব্যাচ)
        // ============================================================
        async function loadAll() {
            // প্লেসহোল্ডার সরানো
            const placeholder = grid.querySelector('.loading-placeholder');
            if (placeholder) placeholder.remove();

            let loaded = 0;

            for (let i = 0; i < TOTAL; i += CONCURRENCY) {
                const end = Math.min(i + CONCURRENCY, TOTAL);
                const batchPromises = [];

                for (let j = i; j < end; j++) {
                    batchPromises.push(fetchAndBuildCard(j));
                }

                const results = await Promise.allSettled(batchPromises);

                for (const result of results) {
                    if (result.status === 'fulfilled') {
                        const cardData = result.value;
                        allCards.push(cardData);
                        grid.appendChild(cardData.element);

                        // কাউন্ট আপডেট
                        if (cardData.format === 'gif') gifTotal++;
                        else if (cardData.format === 'png') pngTotal++;
                    } else {
                        // খুবই বিরল ক্ষেত্রে
                        const idx = loaded;
                        const fallback = document.createElement('div');
                        fallback.className = 'nft-card';
                        fallback.dataset.tokenId = idx + 1;
                        fallback.dataset.format = 'error';
                        fallback.style.borderColor = 'rgba(200,80,80,0.15)';
                        fallback.innerHTML = `
                            <div class="media-wrapper" style="background:#0f1620; display:flex; align-items:center; justify-content:center; color:#4a6385;">
                                <i class="fas fa-times" style="font-size:2.5rem; opacity:0.2;"></i>
                            </div>
                            <div class="nft-info">
                                <div class="nft-name">DystoPunk #${idx+1} <span class="token-id">#${idx+1}</span></div>
                                <div class="attributes"><span class="trait">লোড হয়নি</span></div>
                                <div class="card-footer"><span class="format"><i class="fas fa-ban"></i> Error</span></div>
                            </div>
                        `;
                        allCards.push({
                            element: fallback,
                            tokenId: idx + 1,
                            name: `DystoPunk #${idx+1}`,
                            format: 'error',
                            attributes: []
                        });
                        grid.appendChild(fallback);
                    }
                    loaded++;
                }

                // প্রগ্রেস আপডেট
                const percent = Math.min(100, Math.round((loaded / TOTAL) * 100));
                progressBar.style.width = percent + '%';
                progressText.innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i> 
                    ${loaded} / ${TOTAL} লোড হয়েছে 
                    <span style="color:#4a6385; margin-left:0.5rem;">
                        (GIF: ${gifTotal} · PNG: ${pngTotal})
                    </span>
                `;

                // কাউন্টার আপডেট
                totalCount.textContent = loaded;
                gifCount.textContent = gifTotal;
                pngCount.textContent = pngTotal;
            }

            // সম্পূর্ণ
            progressBar.style.width = '100%';
            progressText.innerHTML = `
                <i class="fas fa-check-circle" style="color:#4f7dff;"></i> 
                ✅ ${TOTAL} / ${TOTAL} সম্পূর্ণ! 
                <span style="color:#4a6385; margin-left:0.5rem;">
                    (GIF: ${gifTotal} · PNG: ${pngTotal})
                </span>
            `;

            // ডিফল্ট ফিল্টার apply
            applyFilters();

            console.log(`✅ মোট ${TOTAL} টি NFT লোড সম্পূর্ণ!`);
        }

        // ============================================================
        //  ইভেন্ট লিসেনার
        // ============================================================

        // সার্চ
        function handleSearch() {
            searchQuery = searchInput.value;
            applyFilters();
        }

        searchInput.addEventListener('input', handleSearch);
        searchBtn.addEventListener('click', handleSearch);

        // ফিল্টার ট্যাগ
        filterTags.forEach(tag => {
            tag.addEventListener('click', function() {
                filterTags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });

        // এন্টার কী
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleSearch();
        });

        // ============================================================
        //  শুরু করা
        // ============================================================
        loadAll().catch(err => {
            console.error('গ্লোবাল এরর:', err);
            grid.innerHTML = `
                <div class="loading-placeholder" style="color:#d67a7a;">
                    <div style="font-size:2.5rem; margin-bottom:0.5rem;">⚠️</div>
                    <div class="main-text">গ্যালারি লোড করতে সমস্যা</div>
                    <div class="sub-text">পৃষ্ঠা রিফ্রেশ করে আবার চেষ্টা করুন</div>
                </div>
            `;
        });

    })();
</script>

</body>
</html>
