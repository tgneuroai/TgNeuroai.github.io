<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burned-Only NFT Extractor (Fixed)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gradient-text {
      background: linear-gradient(135deg, #ef4444 0%, #ec4899 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0b0f17]/90 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-pink-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-red-500/20">
          <i class="fa-solid fa-fire"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">Burned-Only <span class="gradient-text">NFT Extractor</span></span>
      </div>

      <div class="flex items-center gap-3">
        <button id="downloadImagesBtn" onclick="downloadImagesZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-file-zipper"></i>
          <span>Download SVG ZIP</span>
        </button>
        <button id="downloadJsonBtn" onclick="downloadMetadataZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-code"></i>
          <span>Download JSON ZIP</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">

    <!-- Config Card -->
    <div class="glass-card p-6 rounded-2xl mb-8 border border-white/10">

      <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6">
        <div class="md:col-span-5">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Alchemy API Key</label>
          <input type="text" id="apiKeyInput" value="" placeholder="আপনার Alchemy API Key দিন" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition font-mono">
        </div>
        <div class="md:col-span-7">
          <label class="block text-xs text-gray-400 mb-1 font-medium">NFT Contract Address</label>
          <input type="text" id="contractInput" value="0x9eb6e2025b64f340691e424b7fe7022ffde12438" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 transition font-mono">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end border-t border-white/10 pt-4">
        <div class="sm:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Scan Start Token ID</label>
          <input type="number" id="rangeStart" value="1" min="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 font-mono">
        </div>

        <div class="sm:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Scan End Token ID</label>
          <input type="number" id="rangeEnd" value="10000" min="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500 font-mono">
        </div>

        <div class="sm:col-span-4">
          <button id="scanBtn" onclick="startScan()" class="w-full bg-gradient-to-r from-red-600 to-pink-600 text-white font-bold py-2.5 px-4 rounded-xl hover:opacity-90 transition shadow-lg shadow-red-500/20 flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-magnifying-glass font-bold"></i> Find & Load Burned NFTs
          </button>
        </div>
      </div>

    </div>

    <!-- Live Status Box -->
    <div id="statusBox" class="glass-card p-6 rounded-2xl mb-8 border border-white/10 hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div id="statusDot" class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
          <span id="statusText" class="text-sm font-semibold text-white">Scanning Contract for Burned Tokens...</span>
        </div>
        <span id="progressCount" class="text-xs font-mono text-red-400 font-bold">0 Burned Found</span>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden border border-white/5">
        <div id="progressBar" class="bg-red-500 h-full w-0 transition-all duration-150"></div>
      </div>
      <div id="errorBox" class="mt-3 text-xs text-red-400 font-mono hidden"></div>
    </div>

    <!-- Gallery Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-fire text-red-500"></i>
        Burned NFTs Only
      </h2>
      <div class="text-xs text-gray-400 font-mono">
        Total Burned Loaded: <span id="loadedCount" class="text-red-400 font-bold">0</span>
      </div>
    </div>

    <!-- NFT Grid -->
    <div id="nftGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

  </main>

  <footer class="border-t border-white/10 py-6 bg-black/40 text-center text-xs text-gray-500">
    Direct Smart Contract RPC Reader • Burned Token Extractor
  </footer>

  <script>
    let burnedNFTs = [];
    let isFetching = false;

    function encodeTokenURI(tokenId) {
      return "0xc87b56dd" + BigInt(tokenId).toString(16).padStart(64, '0');
    }

    // Correct 32-byte (64 hex char) zero-address topic
    const ZERO_ADDRESS_TOPIC = "0x" + "0".repeat(64);
    const TRANSFER_EVENT_TOPIC = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";

    function decodeABIString(hexString) {
      if (!hexString || hexString === "0x") return null;
      let cleanHex = hexString.replace(/^0x/, '');
      if (cleanHex.length >= 128) {
        let lengthHex = cleanHex.substring(64, 128);
        let strLen = parseInt(lengthHex, 16);
        let dataHex = cleanHex.substring(128, 128 + (strLen * 2));
        if (dataHex.length === 0) return null;
        let bytes = new Uint8Array(dataHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        return new TextDecoder().decode(bytes);
      }
      return null;
    }

    function parseMetadata(uriString) {
      if (!uriString) return null;
      try {
        if (uriString.startsWith('data:application/json;base64,')) {
          return JSON.parse(atob(uriString.replace('data:application/json;base64,', '')));
        } else if (uriString.startsWith('data:application/json;utf8,')) {
          return JSON.parse(decodeURIComponent(uriString.replace('data:application/json;utf8,', '')));
        } else if (uriString.startsWith('data:application/json,')) {
          return JSON.parse(decodeURIComponent(uriString.replace('data:application/json,', '')));
        } else if (uriString.startsWith('{')) {
          return JSON.parse(uriString);
        }
      } catch (e) {
        console.error("Metadata JSON Parse error", e);
      }
      return null;
    }

    async function rpcCall(rpcUrl, payload) {
      const res = await fetch(rpcUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text.substring(0, 200)}`);
      }
      return res.json();
    }

    function showError(msg) {
      const errorBox = document.getElementById("errorBox");
      errorBox.classList.remove("hidden");
      errorBox.innerText = msg;
    }

    async function getLatestBlockNumber(rpcUrl) {
      const data = await rpcCall(rpcUrl, { jsonrpc: "2.0", id: 1, method: "eth_blockNumber", params: [] });
      if (data.error) throw new Error(data.error.message || "eth_blockNumber failed");
      return parseInt(data.result, 16);
    }

    // Alchemy's enhanced "alchemy_getAssetTransfers" API has NO block-range limit
    // (unlike raw eth_getLogs, which free-tier plans cap at ~10 blocks per call).
    // It's paginated with pageKey, so we just loop pages until it's done.
    const NULL_ADDRESS = "0x0000000000000000000000000000000000000000";

    async function fetchBurnTransfersViaAssetTransfers(rpcUrl, contract, statusText, progressBar) {
      const allTransfers = [];
      let pageKey = undefined;
      let page = 0;

      do {
        page++;
        const params = {
          fromBlock: "0x0",
          toBlock: "latest",
          toAddress: NULL_ADDRESS,
          contractAddresses: [contract],
          category: ["erc721", "erc1155"],
          withMetadata: false,
          excludeZeroValue: false,
          maxCount: "0x3e8" // 1000 per page, the max Alchemy allows
        };
        if (pageKey) params.pageKey = pageKey;

        const data = await rpcCall(rpcUrl, {
          jsonrpc: "2.0",
          id: 1,
          method: "alchemy_getAssetTransfers",
          params: [params]
        });

        if (data.error) {
          throw new Error(data.error.message || "alchemy_getAssetTransfers failed");
        }

        const result = data.result || {};
        const transfers = result.transfers || [];
        allTransfers.push(...transfers);
        pageKey = result.pageKey;

        statusText.innerText = `Fetched page ${page} (${allTransfers.length} burn transfers so far)...`;
        const pct = Math.min(50, 5 + page * 5);
        progressBar.style.width = pct + "%";

      } while (pageKey);

      return allTransfers;
    }

    async function startScan() {
      if (isFetching) return;

      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const contract = document.getElementById("contractInput").value.trim();
      const startNum = parseInt(document.getElementById("rangeStart").value) || 1;
      const endNum = parseInt(document.getElementById("rangeEnd").value) || 10000;

      if (!apiKey) {
        alert("দয়া করে আপনার Alchemy API Key দিন।");
        return;
      }

      isFetching = true;

      const grid = document.getElementById("nftGrid");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const progressCount = document.getElementById("progressCount");
      const loadedCount = document.getElementById("loadedCount");
      const errorBox = document.getElementById("errorBox");

      grid.innerHTML = "";
      burnedNFTs = [];
      errorBox.classList.add("hidden");
      errorBox.innerText = "";
      statusBox.classList.remove("hidden");
      progressBar.style.width = "5%";
      loadedCount.innerText = "0";
      progressCount.innerText = "0 Burned Found";

      const rpcUrl = `https://eth-mainnet.g.alchemy.com/v2/${apiKey}`;

      try {
        statusText.innerText = "Querying Burned Transfers via Alchemy Enhanced API...";
        const transfers = await fetchBurnTransfersViaAssetTransfers(rpcUrl, contract, statusText, progressBar);

        let burnedTokenSet = new Set();
        transfers.forEach(t => {
          let tokenIdHex = t.erc721TokenId || (t.erc1155Metadata && t.erc1155Metadata[0] && t.erc1155Metadata[0].tokenId);
          if (!tokenIdHex) return;
          let tokenId = parseInt(tokenIdHex, 16);
          if (tokenId >= startNum && tokenId <= endNum) {
            burnedTokenSet.add(tokenId);
          }
        });

        let burnedTokenList = Array.from(burnedTokenSet).sort((a, b) => a - b);

        statusText.innerText = `Found ${burnedTokenList.length} Burned Tokens! Fetching On-Chain Metadata...`;
        progressCount.innerText = `${burnedTokenList.length} Burned Found`;
        progressBar.style.width = "50%";

        if (burnedTokenList.length === 0) {
          statusText.innerText = "No Burned tokens found in this range or contract logs!";
          isFetching = false;
          return;
        }

        // Fetch each token's metadata individually (not as a JSON-RPC batch array,
        // which free-tier Alchemy tends to rate-limit / drop the connection on).
        // Use limited concurrency plus retry-with-backoff so transient
        // "Failed to fetch" network errors don't silently drop tokens.
        const CONCURRENCY = 5;
        const MAX_RETRIES = 4;
        let processedCount = 0;
        let failedTokens = [];

        async function fetchOneToken(tokenId) {
          let lastErr = null;
          for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
            try {
              const res = await rpcCall(rpcUrl, {
                jsonrpc: "2.0",
                id: tokenId,
                method: "eth_call",
                params: [{ to: contract, data: encodeTokenURI(tokenId) }, "latest"]
              });

              if (res.error) {
                console.warn(`Token ${tokenId} eth_call error:`, res.error.message);
                return; // contract-level error, not worth retrying
              }

              if (res.result && res.result !== "0x") {
                const rawUri = decodeABIString(res.result);
                const metadata = parseMetadata(rawUri);

                if (metadata) {
                  const nftData = {
                    tokenId: tokenId,
                    name: metadata.name || `#${tokenId}`,
                    image: metadata.image || '',
                    rawMetadata: metadata
                  };
                  burnedNFTs.push(nftData);
                  renderSingleCard(nftData);
                }
              }
              return; // success, stop retrying
            } catch (e) {
              lastErr = e;
              // exponential backoff before retry: 300ms, 600ms, 1200ms, 2400ms...
              await new Promise(r => setTimeout(r, 300 * Math.pow(2, attempt)));
            }
          }
          failedTokens.push(tokenId);
          console.error(`Token ${tokenId} failed after ${MAX_RETRIES + 1} attempts:`, lastErr && lastErr.message);
        }

        // Simple concurrency-limited pool
        let nextIndex = 0;
        async function worker() {
          while (nextIndex < burnedTokenList.length) {
            const idx = nextIndex++;
            const tokenId = burnedTokenList[idx];
            await fetchOneToken(tokenId);
            processedCount++;
            let pct = 50 + Math.floor((processedCount / burnedTokenList.length) * 50);
            progressBar.style.width = pct + "%";
            loadedCount.innerText = burnedNFTs.length;
            statusText.innerText = `Loading metadata: ${processedCount}/${burnedTokenList.length} (found ${burnedNFTs.length})...`;
          }
        }

        const workers = [];
        for (let w = 0; w < CONCURRENCY; w++) workers.push(worker());
        await Promise.all(workers);

        if (failedTokens.length > 0) {
          showError(`${failedTokens.length} token(s) failed after retries: ${failedTokens.slice(0, 20).join(', ')}${failedTokens.length > 20 ? '...' : ''}`);
        }

        statusText.innerText = `Success! Loaded ${burnedNFTs.length} Burned NFTs directly from On-Chain Contract.`;
        progressBar.style.width = "100%";
        if (burnedNFTs.length > 0) enableDownloadButtons();

      } catch (err) {
        console.error(err);
        statusText.innerText = "Error occurred while scanning.";
        showError(err.message);
      } finally {
        isFetching = false;
      }
    }

    function renderSingleCard(nft) {
      const grid = document.getElementById("nftGrid");
      const title = nft.name || `#${nft.tokenId}`;

      const card = document.createElement("div");
      card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between p-3 border border-red-500/20";

      card.innerHTML = `
        <div class="relative aspect-square rounded-xl overflow-hidden bg-black/50 border border-white/5 flex items-center justify-center">
          <img src="${nft.image}"
               alt="${title}"
               loading="lazy"
               class="w-full h-full object-contain"
               onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/111827/EF4444?text=Burned+NFT';" />
          <div class="absolute top-2 left-2 bg-red-600/90 text-white font-mono font-bold text-[10px] px-2 py-0.5 rounded-md shadow-md">
            BURNED #${nft.tokenId}
          </div>
        </div>
        <div class="mt-3 px-1">
          <h3 class="font-bold text-white text-sm truncate">${title}</h3>
          <p class="text-[11px] text-red-400 font-mono mt-0.5">Status: Null Address (Burned)</p>
        </div>
      `;

      grid.appendChild(card);
    }

    function enableDownloadButtons() {
      const imgBtn = document.getElementById("downloadImagesBtn");
      const jsonBtn = document.getElementById("downloadJsonBtn");

      imgBtn.disabled = false;
      imgBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-red-600 text-white hover:bg-red-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-red-500/20";

      jsonBtn.disabled = false;
      jsonBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-pink-600 text-white hover:bg-pink-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-pink-500/20";
    }

    async function downloadImagesZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Extracting Burned SVG files...";

      burnedNFTs.forEach((nft) => {
        let imgUrl = nft.image;
        if (imgUrl.startsWith('data:image/svg+xml;base64,')) {
          zip.file(`${nft.tokenId}.svg`, imgUrl.replace('data:image/svg+xml;base64,', ''), { base64: true });
        } else if (imgUrl.startsWith('data:image/svg+xml;utf8,')) {
          zip.file(`${nft.tokenId}.svg`, decodeURIComponent(imgUrl.replace('data:image/svg+xml;utf8,', '')));
        } else if (imgUrl.startsWith('<svg')) {
          zip.file(`${nft.tokenId}.svg`, imgUrl);
        }
      });

      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, `Burned_Only_NFT_SVGs.zip`);
      statusText.innerText = "SVG ZIP Download Complete!";
    }

    async function downloadMetadataZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Generating Metadata JSONs...";

      burnedNFTs.forEach((nft) => {
        zip.file(`${nft.tokenId}.json`, JSON.stringify(nft.rawMetadata, null, 2));
      });

      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, `Burned_Only_NFT_JSONs.zip`);
      statusText.innerText = "JSON ZIP Download Complete!";
    }
  </script>
</body>
</html>
