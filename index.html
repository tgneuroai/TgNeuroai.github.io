<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Fast NFT Studio & Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- JSZip and FileSaver for High Speed Zip Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080b11;
      color: #f3f4f6;
    }

    .neon-text {
      color: #d4ff00;
      text-shadow: 0 0 10px rgba(212, 255, 0, 0.3);
    }

    .neon-border {
      border-color: #d4ff00;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card:hover {
      border-color: rgba(212, 255, 0, 0.4);
      box-shadow: 0 10px 30px -10px rgba(212, 255, 0, 0.15);
    }

    .custom-progress-bar {
      transition: width 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4ff00] selection:text-black">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#080b11]/90 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#d4ff00] flex items-center justify-center text-black font-bold text-xl shadow-lg shadow-[#d4ff00]/20">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">NFT <span class="neon-text">Studio Pro</span></span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button id="downloadImagesBtn" onclick="downloadImagesZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-file-zipper"></i>
          <span>Images ZIP</span>
        </button>
        <button id="downloadJsonBtn" onclick="downloadMetadataZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-code"></i>
          <span>JSON ZIP</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
    
    <!-- API Settings Bar -->
    <div class="glass-card p-6 rounded-2xl mb-8 border border-white/10">
      <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders neon-text"></i> Alchemy API Settings
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Alchemy API Key</label>
          <input type="text" id="apiKeyInput" value="Sgfq6KI6igqQuemutQiHy" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#d4ff00] transition font-mono">
        </div>
        <div class="md:col-span-6">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Contract Address</label>
          <input type="text" id="contractInput" value="0x9eb6e2025b64f340691e424b7fe7022ffde12438" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#d4ff00] transition font-mono">
        </div>
        <div class="md:col-span-2 flex items-end">
          <button onclick="startFetching()" class="w-full bg-[#d4ff00] text-black font-bold py-2.5 px-4 rounded-xl hover:bg-[#c2eb00] transition shadow-lg shadow-[#d4ff00]/20 flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-arrows-rotate"></i> Load Collection
          </button>
        </div>
      </div>
    </div>

    <!-- Live Status & Progress Bar -->
    <div id="statusBox" class="glass-card p-6 rounded-2xl mb-8 border border-white/10 hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-[#d4ff00] animate-ping"></div>
          <span id="statusText" class="text-sm font-semibold text-white">Fetching metadata from Alchemy...</span>
        </div>
        <span id="progressCount" class="text-xs font-mono neon-text font-bold">0 / 0</span>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden border border-white/5">
        <div id="progressBar" class="bg-[#d4ff00] h-full w-0 custom-progress-bar shadow-[0_0_12px_#d4ff00]"></div>
      </div>
    </div>

    <!-- Gallery Grid Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-border-all neon-text"></i>
        Collection Gallery
      </h2>
      <div class="text-xs text-gray-400 font-mono">
        Loaded NFTs: <span id="loadedCount" class="text-white font-bold">0</span>
      </div>
    </div>

    <!-- NFT Grid -->
    <div id="nftGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

  </main>

  <footer class="border-t border-white/10 py-6 bg-black/60 text-center text-xs text-gray-500">
    Ultra Fast Parallel Processor • Alchemy API v3
  </footer>

  <script>
    let allNFTs = [];
    let isFetching = false;

    // Canvas Utility to Recolor Image Canvas High-Speed
    function recolorImage(imgElement, targetWidth = 400, targetHeight = 400) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = imgElement.naturalWidth || targetWidth;
        canvas.height = imgElement.naturalHeight || targetHeight;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // Target Color 1: #E3E5E4 (227, 229, 228) -> Replace with #D4FF00 (212, 255, 0)
        // Target Color 2: #48494B (72, 73, 75) -> Replace with #000000 (0, 0, 0)
        const tol = 15; // Tolerance for slight variations

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          // Check for #E3E5E4
          if (Math.abs(r - 227) <= tol && Math.abs(g - 229) <= tol && Math.abs(b - 228) <= tol) {
            data[i] = 212;   // Red
            data[i + 1] = 255; // Green
            data[i + 2] = 0;   // Blue
          }
          // Check for #48494B
          else if (Math.abs(r - 72) <= tol && Math.abs(g - 73) <= tol && Math.abs(b - 75) <= tol) {
            data[i] = 0;     // Red
            data[i + 1] = 0; // Green
            data[i + 2] = 0; // Blue
          }
        }

        ctx.putImageData(imgData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      });
    }

    function resolveIpfsUrl(url) {
      if (!url) return 'https://via.placeholder.com/400x400/111827/6B7280?text=No+Image';
      if (url.startsWith('ipfs://')) {
        return url.replace('ipfs://', 'https://ipfs.io/ipfs/');
      }
      return url;
    }

    async function startFetching() {
      if (isFetching) return;
      isFetching = true;

      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const contract = document.getElementById("contractInput").value.trim();
      
      const grid = document.getElementById("nftGrid");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const progressCount = document.getElementById("progressCount");
      const loadedCount = document.getElementById("loadedCount");

      grid.innerHTML = "";
      allNFTs = [];
      statusBox.classList.remove("hidden");
      
      let pageKey = null;
      let totalFetched = 0;

      try {
        do {
          let url = `https://eth-mainnet.g.alchemy.com/nft/v3/${apiKey}/getNFTsForContract?contractAddress=${contract}&withMetadata=true&limit=100`;
          if (pageKey) {
            url += `&pageKey=${pageKey}`;
          }

          statusText.innerText = `Fetching collection metadata... (${totalFetched} loaded)`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Failed to fetch API metadata");

          const data = await res.json();
          const nfts = data.nfts || [];
          
          if (nfts.length === 0) break;

          allNFTs.push(...nfts);
          totalFetched = allNFTs.length;
          pageKey = data.pageKey;

          progressCount.innerText = `${totalFetched} NFTs Metadata Loaded`;
          loadedCount.innerText = totalFetched;
          
          // Render items progressively
          renderNFTBatch(nfts);

        } while (pageKey && allNFTs.length < 10000);

        statusText.innerText = "All NFT Metadata Loaded Successfully!";
        progressBar.style.width = "100%";
        
        enableDownloadButtons();

      } catch (err) {
        console.error(err);
        statusText.innerText = "Error loading collection: " + err.message;
      } finally {
        isFetching = false;
      }
    }

    function renderNFTBatch(nfts) {
      const grid = document.getElementById("nftGrid");

      nfts.forEach((nft, index) => {
        const tokenId = nft.tokenId || (allNFTs.indexOf(nft) + 1);
        const title = nft.name || nft.title || `#${tokenId}`;
        let rawImgUrl = nft.image?.cachedUrl || nft.image?.originalUrl || nft.raw?.metadata?.image;
        rawImgUrl = resolveIpfsUrl(rawImgUrl);

        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between p-3";
        card.id = `nft-card-${tokenId}`;

        card.innerHTML = `
          <div class="relative aspect-square rounded-xl overflow-hidden bg-black/50 border border-white/5 flex items-center justify-center">
            <img id="img-${tokenId}" crossorigin="anonymous" src="${rawImgUrl}" 
                 class="w-full h-full object-cover hidden" 
                 onload="processCardImage(this, '${tokenId}')"
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/111827/6B7280?text=Load+Error'; this.classList.remove('hidden');" />
            <div id="loader-${tokenId}" class="text-xs text-gray-500 font-mono animate-pulse flex items-center gap-1">
              <i class="fa-solid fa-circle-notch fa-spin text-[#d4ff00]"></i> Recoloring...
            </div>
            <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded-md border border-white/10 text-[10px] font-mono neon-text">
              #${tokenId}
            </div>
          </div>
          <div class="mt-3 px-1">
            <h3 class="font-bold text-white text-sm truncate">${title}</h3>
            <p class="text-[11px] text-gray-400 font-mono mt-0.5">Token ID: ${tokenId}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function processCardImage(imgEl, tokenId) {
      try {
        const processedDataUrl = await recolorImage(imgEl);
        imgEl.src = processedDataUrl;
        imgEl.classList.remove('hidden');
        document.getElementById(`loader-${tokenId}`).classList.add('hidden');
        
        // Save processed canvas data back to object for fast ZIP export
        const found = allNFTs.find(n => (n.tokenId || '') == tokenId);
        if (found) found.recoloredDataUrl = processedDataUrl;

      } catch (e) {
        console.error("Canvas recolor error", e);
        imgEl.classList.remove('hidden');
        document.getElementById(`loader-${tokenId}`).classList.add('hidden');
      }
    }

    function enableDownloadButtons() {
      const imgBtn = document.getElementById("downloadImagesBtn");
      const jsonBtn = document.getElementById("downloadJsonBtn");

      imgBtn.disabled = false;
      imgBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-[#d4ff00] text-black hover:bg-[#c2eb00] cursor-pointer transition flex items-center gap-2 shadow-lg shadow-[#d4ff00]/20";

      jsonBtn.disabled = false;
      jsonBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-indigo-500/20";
    }

    // High Speed ZIP Images Downloader
    async function downloadImagesZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");

      statusText.innerText = "Compiling recolored images into ZIP...";
      
      let count = 0;
      const total = allNFTs.length;

      for (let i = 0; i < total; i++) {
        const nft = allNFTs[i];
        const serialNumber = i + 1; // Strict Sequential Order (1, 2, 3...)
        
        let dataUrl = nft.recoloredDataUrl;

        if (!dataUrl) {
          // Fallback fetch if canvas was not rendered
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = resolveIpfsUrl(nft.image?.cachedUrl || nft.image?.originalUrl || nft.raw?.metadata?.image);
          await new Promise(r => img.onload = r);
          dataUrl = await recolorImage(img);
        }

        const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
        zip.file(`${serialNumber}.png`, base64Data, { base64: true });

        count++;
        let pct = Math.floor((count / total) * 100);
        progressBar.style.width = pct + "%";
        statusText.innerText = `Adding image ${serialNumber} of ${total} to ZIP...`;
      }

      statusText.innerText = "Generating ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "NFT_Images_Collection.zip");
      statusText.innerText = "Images ZIP Downloaded Successfully!";
    }

    // High Speed ZIP JSON Metadata Downloader
    async function downloadMetadataZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Compiling JSON Metadata into ZIP...";

      allNFTs.forEach((nft, index) => {
        const serialNumber = index + 1; // Strict Serial Number (1, 2, 3...)
        const jsonContent = JSON.stringify(nft.raw?.metadata || nft, null, 2);
        zip.file(`${serialNumber}.json`, jsonContent);
      });

      statusText.innerText = "Generating Metadata ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "NFT_Metadata_JSON.zip");
      statusText.innerText = "JSON ZIP Downloaded Successfully!";
    }

    // Auto Start on Load
    window.addEventListener("DOMContentLoaded", startFetching);
  </script>
</body>
</html>
