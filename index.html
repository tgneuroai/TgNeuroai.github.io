<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burned On-Chain NFT Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- JSZip and FileSaver for Zip Exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gradient-text {
      background: linear-gradient(135deg, #f43f5e 0%, #a855f7 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0b0f17]/90 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-rose-500/20">
          <i class="fa-solid fa-fire"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">Burned NFT <span class="gradient-text">OnChain Extractor</span></span>
      </div>

      <!-- Export Controls -->
      <div class="flex items-center gap-3">
        <button id="downloadImagesBtn" onclick="downloadImagesZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-file-zipper"></i>
          <span>Download SVG ZIP</span>
        </button>
        <button id="downloadJsonBtn" onclick="downloadMetadataZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-code"></i>
          <span>Download JSON ZIP</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
    
    <!-- Direct Smart Contract Config Bar -->
    <div class="glass-card p-6 rounded-2xl mb-8 border border-white/10">
      
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6 border-b border-white/10 pb-6">
        <div class="md:col-span-5">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Alchemy API Key / RPC Key</label>
          <input type="text" id="apiKeyInput" value="Sgfq6KI6igqQuemutQiHy" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition font-mono">
        </div>
        <div class="md:col-span-7">
          <label class="block text-xs text-gray-400 mb-1 font-medium">NFT Contract Address</label>
          <input type="text" id="contractInput" value="0x9eb6e2025b64f340691e424b7fe7022ffde12438" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 transition font-mono">
        </div>
      </div>

      <!-- Burned Token Range Selector -->
      <h2 class="text-xs font-bold uppercase tracking-wider text-rose-400 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-fire"></i> Select Burned NFT Range To Read From Contract
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
        <div class="sm:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Start Token ID (e.g. 7336)</label>
          <input type="number" id="rangeStart" value="7336" min="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 font-mono">
        </div>

        <div class="sm:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">End Token ID (e.g. 10000)</label>
          <input type="number" id="rangeEnd" value="7500" min="1" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500 font-mono">
        </div>

        <div class="sm:col-span-4">
          <button onclick="startBurnedFetch()" class="w-full bg-gradient-to-r from-rose-600 to-purple-600 text-white font-bold py-2.5 px-4 rounded-xl hover:opacity-90 transition shadow-lg shadow-rose-500/20 flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-[#fa4d56] fa-bolt"></i> Fetch Burned NFTs
          </button>
        </div>
      </div>

    </div>

    <!-- Live Status -->
    <div id="statusBox" class="glass-card p-6 rounded-2xl mb-8 border border-white/10 hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></div>
          <span id="statusText" class="text-sm font-semibold text-white">Connecting to Contract RPC...</span>
        </div>
        <span id="progressCount" class="text-xs font-mono text-rose-400 font-bold">0 Loaded</span>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden border border-white/5">
        <div id="progressBar" class="bg-rose-500 h-full w-0 transition-all duration-150"></div>
      </div>
    </div>

    <!-- Gallery Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-border-all text-rose-400"></i>
        Burned / Contract NFTs
      </h2>
      <div class="text-xs text-gray-400 font-mono">
        Extracted NFTs: <span id="loadedCount" class="text-white font-bold">0</span>
      </div>
    </div>

    <!-- NFT Grid -->
    <div id="nftGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

  </main>

  <footer class="border-t border-white/10 py-6 bg-black/40 text-center text-xs text-gray-500">
    Direct Smart Contract RPC Reader • Full On-Chain Extractor
  </footer>

  <script>
    let activeNFTs = [];
    let isFetching = false;

    // Convert Token ID to 32-byte HEX for tokenURI(uint256) function
    function encodeTokenIdForTokenURI(tokenId) {
      // Function signature hash for tokenURI(uint256) is 0xc87b56dd
      const methodSig = "0xc87b56dd";
      const hexTokenId = Number(tokenId).toString(16).padStart(64, '0');
      return methodSig + hexTokenId;
    }

    // Decode ABI Encoded String response from Contract
    function decodeABIString(hexString) {
      if (!hexString || hexString === "0x") return null;
      let cleanHex = hexString.replace(/^0x/, '');
      
      // ABI String format has offset, length, and content
      if (cleanHex.length >= 128) {
        let lengthHex = cleanHex.substring(64, 128);
        let strLen = parseInt(lengthHex, 16);
        let dataHex = cleanHex.substring(128, 128 + (strLen * 2));
        
        let bytes = new Uint8Array(dataHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        return new TextDecoder().decode(bytes);
      }
      return null;
    }

    // Parse Data URI Metadata (Base64 JSON / Base64 SVG)
    function parseOnChainMetadata(uriString) {
      if (!uriString) return null;

      try {
        if (uriString.startsWith('data:application/json;base64,')) {
          const jsonStr = atob(uriString.replace('data:application/json;base64,', ''));
          return JSON.parse(jsonStr);
        } else if (uriString.startsWith('data:application/json;utf8,')) {
          return JSON.parse(uriString.replace('data:application/json;utf8,', ''));
        } else if (uriString.startsWith('{')) {
          return JSON.parse(uriString);
        }
      } catch (e) {
        console.error("Metadata JSON Parse error", e);
      }
      return null;
    }

    async function startBurnedFetch() {
      if (isFetching) return;

      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const contract = document.getElementById("contractInput").value.trim();
      const startNum = parseInt(document.getElementById("rangeStart").value) || 7336;
      const endNum = parseInt(document.getElementById("rangeEnd").value) || 7500;

      if (startNum > endNum) {
        alert("Start Token ID must be smaller than End Token ID!");
        return;
      }

      isFetching = true;

      const grid = document.getElementById("nftGrid");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const progressCount = document.getElementById("progressCount");
      const loadedCount = document.getElementById("loadedCount");

      grid.innerHTML = "";
      activeNFTs = [];
      statusBox.classList.remove("hidden");

      const rpcUrl = `https://eth-mainnet.g.alchemy.com/v2/${apiKey}`;
      let totalToFetch = (endNum - startNum) + 1;
      let currentId = startNum;

      try {
        while (currentId <= endNum) {
          statusText.innerText = `Reading On-Chain Contract for Token #${currentId}...`;

          // Direct eth_call to RPC to get tokenURI(tokenId)
          const rpcPayload = {
            jsonrpc: "2.0",
            id: currentId,
            method: "eth_call",
            params: [{
              to: contract,
              data: encodeTokenIdForTokenURI(currentId)
            }, "latest"]
          };

          const res = await fetch(rpcUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(rpcPayload)
          });

          const resData = await res.json();

          if (resData.result && resData.result !== "0x") {
            const rawUri = decodeABIString(resData.result);
            const metadata = parseOnChainMetadata(rawUri);

            if (metadata) {
              const nftData = {
                tokenId: currentId,
                name: metadata.name || `#${currentId}`,
                description: metadata.description || '',
                image: metadata.image || '',
                rawMetadata: metadata
              };

              activeNFTs.push(nftData);
              renderSingleCard(nftData);
            }
          } else {
            console.warn(`Token #${currentId} URI not returned from contract.`);
          }

          // Progress update
          let completed = (currentId - startNum) + 1;
          let pct = Math.floor((completed / totalToFetch) * 100);
          progressBar.style.width = pct + "%";
          progressCount.innerText = `${activeNFTs.length} Extracted`;
          loadedCount.innerText = activeNFTs.length;

          currentId++;
        }

        statusText.innerText = `Finished Extracting Range #${startNum} to #${endNum}!`;
        progressBar.style.width = "100%";
        enableDownloadButtons();

      } catch (err) {
        console.error(err);
        statusText.innerText = "RPC Error: " + err.message;
      } finally {
        isFetching = false;
      }
    }

    function renderSingleCard(nft) {
      const grid = document.getElementById("nftGrid");
      const title = nft.name || `#${nft.tokenId}`;
      let imgUrl = nft.image;

      const card = document.createElement("div");
      card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between p-3 transition duration-300";

      card.innerHTML = `
        <div class="relative aspect-square rounded-xl overflow-hidden bg-black/40 border border-white/5 flex items-center justify-center">
          <img src="${imgUrl}" 
               alt="${title}"
               loading="lazy"
               class="w-full h-full object-contain" 
               onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/111827/6B7280?text=Load+Error';" />
          <div class="absolute top-2 left-2 bg-rose-600/90 text-white backdrop-blur-md px-2 py-0.5 rounded-md text-[10px] font-mono font-bold">
            #${nft.tokenId}
          </div>
        </div>
        <div class="mt-3 px-1">
          <h3 class="font-bold text-white text-sm truncate">${title}</h3>
          <p class="text-[11px] text-rose-400 font-mono mt-0.5">Burned / On-Chain Token</p>
        </div>
      `;

      grid.appendChild(card);
    }

    function enableDownloadButtons() {
      const imgBtn = document.getElementById("downloadImagesBtn");
      const jsonBtn = document.getElementById("downloadJsonBtn");

      imgBtn.disabled = false;
      imgBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-rose-600 text-white hover:bg-rose-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-rose-500/20";

      jsonBtn.disabled = false;
      jsonBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-purple-600 text-white hover:bg-purple-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-purple-500/20";
    }

    // SVG ZIP Export
    async function downloadImagesZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Extracting On-Chain SVG files into ZIP...";
      let total = activeNFTs.length;

      activeNFTs.forEach((nft) => {
        const tokenId = nft.tokenId;
        let imgUrl = nft.image;

        if (imgUrl.startsWith('data:image/svg+xml;base64,')) {
          const base64Data = imgUrl.replace('data:image/svg+xml;base64,', '');
          zip.file(`${tokenId}.svg`, base64Data, { base64: true });
        } else if (imgUrl.startsWith('data:image/svg+xml;utf8,')) {
          const svgContent = decodeURIComponent(imgUrl.replace('data:image/svg+xml;utf8,', ''));
          zip.file(`${tokenId}.svg`, svgContent);
        } else if (imgUrl.startsWith('<svg')) {
          zip.file(`${tokenId}.svg`, imgUrl);
        }
      });

      statusText.innerText = "Generating SVG ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      const startVal = document.getElementById("rangeStart").value;
      const endVal = document.getElementById("rangeEnd").value;
      saveAs(content, `Burned_NFT_SVG_${startVal}_to_${endVal}.zip`);
      statusText.innerText = "SVG ZIP Download Complete!";
    }

    // Metadata JSON ZIP Export
    async function downloadMetadataZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Generating JSON Metadata ZIP...";

      activeNFTs.forEach((nft) => {
        const jsonContent = JSON.stringify(nft.rawMetadata, null, 2);
        zip.file(`${nft.tokenId}.json`, jsonContent);
      });

      statusText.innerText = "Generating JSON ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      const startVal = document.getElementById("rangeStart").value;
      const endVal = document.getElementById("rangeEnd").value;
      saveAs(content, `Burned_NFT_JSON_${startVal}_to_${endVal}.zip`);
      statusText.innerText = "JSON ZIP Download Complete!";
    }
  </script>
</body>
</html>
