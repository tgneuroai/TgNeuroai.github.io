<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Multi-Animated ASCII NFT Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #12121e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            gap: 25px;
        }

        /* 512x512 Strict Fixed NFT Card Frame */
        .nft-card {
            background-color: #0d0e15;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 512px;
            height: 512px;
            min-width: 512px;
            min-height: 512px;
            max-width: 512px;
            max-height: 512px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #asciiContainer {
            background-color: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #asciiArt {
            font-size: 8px;
            line-height: 0.85;
            letter-spacing: -0.5px;
            white-space: pre;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-align: center;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 512px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .input-group input[type="number"], .input-group input[type="text"] {
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input[type="number"] {
            width: 110px;
        }

        .input-group input[type="text"] {
            width: 130px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 4px 12px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .btn-load {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: #d4ff00;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(212, 255, 0, 0.2);
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(212, 255, 0, 0.35);
        }

        .quick-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-links button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-links button:hover {
            background: rgba(212, 255, 0, 0.12);
            border-color: rgba(212, 255, 0, 0.3);
            color: #d4ff00;
        }

        .download-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }

        .btn-download {
            padding: 14px 30px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4ff00, #b3db00);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download-png {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        #status-message {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
        }

        #status-message.success { color: #69db7c; }
        #status-message.error { color: #ff6b6b; }
        #status-message.loading { color: #d4ff00; }

        @media (max-width: 550px) {
            .nft-card {
                width: 320px;
                height: 320px;
                min-width: 320px;
                min-height: 320px;
            }
            #asciiArt {
                font-size: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="nft-card" id="nftCardElement">
        <div id="asciiContainer">
            <pre id="asciiArt">⏳ Loading Multi-Animated NFT...</pre>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="nftNumber" value="2" min="1" step="1" placeholder="#">
            
            <div class="color-picker-wrapper">
                <input type="color" id="bgColorPicker" value="#0d0e15">
                <input type="text" id="bgColorInput" value="#0d0e15" placeholder="#0d0e15">
            </div>

            <button class="btn-load" id="loadBtn">⟳ Load NFT</button>
        </div>

        <div class="quick-links">
            <button onclick="loadNFT(1)">#1</button>
            <button onclick="loadNFT(2)">#2</button>
            <button onclick="loadNFT(3)">#3</button>
            <button onclick="loadNFT(4)">#4</button>
            <button onclick="loadNFT(5)">#5</button>
            <button onclick="loadNFT(6)">#6</button>
            <button class="btn-random" onclick="loadRandom()">🎲 Random Style</button>
        </div>

        <div class="download-section">
            <button class="btn-download" id="downloadAsciiBtn">📋 Download ASCII (TXT)</button>
            <button class="btn-download btn-download-png" id="downloadPngBtn">🖼️ Download PNG Image</button>
        </div>

        <div id="status-message">Ready · Enter a number</div>
    </div>

    <script>
        const BASE_URL = "https://ipfs.io/ipfs/bafybeifh2kk6nv5osnwlh7qvjunuowb3vgxaoaqfufxiocozdqdpqqkvnu/";
        let currentNFTNumber = 2;
        let baseImageData = null;
        let animationFrameId = null;
        let frameCount = 0;
        let currentBgColor = "#0d0e15";
        let currentAnimationMode = 0; // Randomly picked per NFT

        const nftNumberInput = document.getElementById('nftNumber');
        const loadBtn = document.getElementById('loadBtn');
        const statusMsg = document.getElementById('status-message');
        const asciiArt = document.getElementById('asciiArt');
        const downloadAsciiBtn = document.getElementById('downloadAsciiBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const nftCardElement = document.getElementById('nftCardElement');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const bgColorInput = document.getElementById('bgColorInput');

        // Symbol Sets & Character Map
        const PATTERN_SET_1 = ['┼', '░', '▒', '▓', '║', '═', '╪', '┼', '╳', '•'];
        const PATTERN_SET_2 = ['░', '▒', '▓', '█', '░', '▒', '▲', '▼', '◆', '✦'];
        const PATTERN_SET_3 = ['·', ':', '─', '│', '┼', '╌', '╍', '░', '▒', '•'];
        
        // Cute ASCII Characters for Subject Rendering
        const ASCII_SUBJECT = '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrftj1ijlnfiI1!i~;-:::... ';

        function updateBackgroundColor(color) {
            currentBgColor = color;
            nftCardElement.style.backgroundColor = color;
            bgColorPicker.value = color;
            bgColorInput.value = color;
        }

        bgColorPicker.addEventListener('input', (e) => updateBackgroundColor(e.target.value));
        bgColorInput.addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (/^#[0-9A-F]{6}$/i.test(val) || /^#[0-9A-F]{3}$/i.test(val)) {
                updateBackgroundColor(val);
            }
        });

        // MULTI-ANIMATION FRAME RENDERER
        function renderCombinedFrame(imageData, width, height, frame, animMode) {
            const data = imageData.data;
            let html = '';
            
            const time = frame / 10; // Slow & smooth timeline
            const centerX = width / 2;
            const centerY = height / 2;

            // Cute Character Breathing/Pulse Calculation
            const characterPulse = Math.sin(time * 0.8) * 0.15 + 1.0; 

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    let r = data[index];
                    let g = data[index + 1];
                    let b = data[index + 2];
                    const a = data[index + 3];

                    if (a < 30) {
                        // BACKGROUND ANIMATION LOGIC (Randomly Chosen)
                        let char = ' ';
                        let colorStr = 'rgba(255,255,255,0.1)';

                        if (animMode === 0) {
                            // 1. Concentric Radial Wave (Reference Style)
                            const dx = x - centerX;
                            const dy = (y - centerY) * 1.5;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            const wave = Math.sin(dist * 0.3 - time);
                            const idx = Math.floor(((wave + 1) / 2) * (PATTERN_SET_1.length - 1));
                            char = PATTERN_SET_1[idx];
                            const gold = Math.floor(190 + wave * 55);
                            const teal = Math.floor(130 - wave * 40);
                            colorStr = `rgba(${gold}, ${teal}, 80, 0.8)`;
                        } else if (animMode === 1) {
                            // 2. Diagonal Matrix Glitch Shift
                            const wave = Math.sin((x + y) * 0.25 - time * 1.2);
                            const idx = Math.floor(((wave + 1) / 2) * (PATTERN_SET_2.length - 1));
                            char = PATTERN_SET_2[idx];
                            colorStr = `rgba(100, 220, 255, ${0.3 + wave * 0.3})`;
                        } else {
                            // 3. Psychedelic Sparkle Flow
                            const wave = Math.cos((x * 0.2) + (y * 0.2) + time);
                            const idx = Math.floor(((wave + 1) / 2) * (PATTERN_SET_3.length - 1));
                            char = PATTERN_SET_3[idx];
                            colorStr = `rgba(255, 150, 200, ${0.4 + wave * 0.3})`;
                        }

                        html += `<span style="color: ${colorStr}">${char}</span>`;
                    } else {
                        // CUTE ANIMATED SUBJECT (Pulse & Brightness Shift)
                        const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                        const charIdx = Math.floor((gray / 255) * (ASCII_SUBJECT.length - 1));
                        const char = ASCII_SUBJECT[charIdx];

                        // Mild cute brightness glow pulse
                        const glowR = Math.min(255, Math.floor(r * characterPulse));
                        const glowG = Math.min(255, Math.floor(g * characterPulse));
                        const glowB = Math.min(255, Math.floor(b * characterPulse));

                        html += `<span style="color: rgb(${glowR},${glowG},${glowB})">${char}</span>`;
                    }
                }
                html += '\n';
            }
            return html;
        }

        // ANIMATION LOOP
        function startCuteMultiAnimation(imageData, width, height) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function animate() {
                frameCount++;
                asciiArt.innerHTML = renderCombinedFrame(imageData, width, height, frameCount, currentAnimationMode);
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function loadNFT(number) {
            if (!number || number < 1 || !Number.isInteger(number)) {
                statusMsg.textContent = '⚠️ সঠিক একটি সংখ্যা দিন';
                statusMsg.className = 'error';
                return;
            }

            currentNFTNumber = number;
            // Pick a Random Animation Pattern (0, 1, or 2)
            currentAnimationMode = Math.floor(Math.random() * 3);

            statusMsg.textContent = `⏳ লোড হচ্ছে #${number} (Mode ${currentAnimationMode + 1})...`;
            statusMsg.className = 'loading';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            asciiArt.innerHTML = '⏳ জেনারেট হচ্ছে এনিমেশন...';

            const imageUrl = `${BASE_URL}${number}.png`;

            fetch(imageUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Image not found');
                    return response.blob();
                })
                .then(blob => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(blob);

                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        let displayWidth = 82; 
                        let displayHeight = Math.floor(displayWidth * (img.height / img.width) * 0.58);

                        canvas.width = displayWidth;
                        canvas.height = displayHeight;

                        ctx.clearRect(0, 0, displayWidth, displayHeight);
                        ctx.drawImage(img, 0, 0, displayWidth, displayHeight);

                        baseImageData = ctx.getImageData(0, 0, displayWidth, displayHeight);
                        
                        startCuteMultiAnimation(baseImageData, displayWidth, displayHeight);

                        const modeNames = ["Concentric Wave", "Diagonal Shift", "Sparkle Flow"];
                        statusMsg.textContent = `✓ #${number} · ${modeNames[currentAnimationMode]} চালু হয়েছে!`;
                        statusMsg.className = 'success';
                        nftNumberInput.value = number;

                        URL.revokeObjectURL(objectUrl);
                    };

                    img.onerror = function() {
                        statusMsg.textContent = `✗ ইমেজ পেতে সমস্যা হয়েছে #${number}`;
                        statusMsg.className = 'error';
                        asciiArt.innerHTML = '⚠️ Image error';
                        URL.revokeObjectURL(objectUrl);
                    };

                    img.src = objectUrl;
                })
                .catch(error => {
                    statusMsg.textContent = `✗ #${number} IPFS-এ পাওয়া যায়নি`;
                    statusMsg.className = 'error';
                    asciiArt.innerHTML = '⚠️ Image not found';
                });
        }

        // DOWNLOAD PNG
        function downloadAsPNG() {
            if (!baseImageData) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const imageSize = 512;
            canvas.width = imageSize;
            canvas.height = imageSize;

            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, imageSize, imageSize);

            const link = document.createElement('a');
            link.download = `NFT_#${currentNFTNumber}_Animated.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadAsciiTXT() {
            if (!asciiArt.innerText) return;
            const blob = new Blob([asciiArt.innerText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `NFT_#${currentNFTNumber}.txt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function loadRandom() {
            const randomNum = Math.floor(Math.random() * 10) + 1;
            loadNFT(randomNum);
        }

        loadBtn.addEventListener('click', () => loadNFT(parseInt(nftNumberInput.value)));
        downloadAsciiBtn.addEventListener('click', downloadAsciiTXT);
        downloadPngBtn.addEventListener('click', downloadAsPNG);

        window.addEventListener('load', () => {
            updateBackgroundColor('#0d0e15');
            loadNFT(2);
        });
    </script>

</body>
</html>
