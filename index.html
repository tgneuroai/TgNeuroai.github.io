<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Chain NFT Loader & Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- JSZip and FileSaver for Ultra Fast Zip Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.25);
    }

    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0b0f17]/90 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-link"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-white">OnChain <span class="gradient-text">Vault</span></span>
      </div>

      <!-- ZIP Download Controls -->
      <div class="flex items-center gap-3">
        <button id="downloadImagesBtn" onclick="downloadImagesZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-file-zipper"></i>
          <span>Download SVG ZIP</span>
        </button>
        <button id="downloadJsonBtn" onclick="downloadMetadataZip()" disabled class="text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-gray-800 text-gray-500 cursor-not-allowed transition flex items-center gap-2 border border-white/5">
          <i class="fa-solid fa-code"></i>
          <span>Download JSON ZIP</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Section -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
    
    <!-- API Controls -->
    <div class="glass-card p-6 rounded-2xl mb-8 border border-white/10">
      <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-gears text-indigo-400"></i> Alchemy API Settings
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-4">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Alchemy API Key</label>
          <input type="text" id="apiKeyInput" value="Sgfq6KI6igqQuemutQiHy" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition font-mono">
        </div>
        <div class="md:col-span-6">
          <label class="block text-xs text-gray-400 mb-1 font-medium">Contract Address</label>
          <input type="text" id="contractInput" value="0x54c5e045a442411390fcba60f858831e9a2d0990" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition font-mono">
        </div>
        <div class="md:col-span-2 flex items-end">
          <button onclick="startFetching()" class="w-full bg-indigo-600 text-white font-bold py-2.5 px-4 rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-arrows-rotate"></i> Fetch All
          </button>
        </div>
      </div>
    </div>

    <!-- Loading Progress Bar -->
    <div id="statusBox" class="glass-card p-6 rounded-2xl mb-8 border border-white/10 hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-indigo-500 animate-ping"></div>
          <span id="statusText" class="text-sm font-semibold text-white">Fetching On-Chain Data...</span>
        </div>
        <span id="progressCount" class="text-xs font-mono text-indigo-400 font-bold">0 Loaded</span>
      </div>
      <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden border border-white/5">
        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-150"></div>
      </div>
    </div>

    <!-- Gallery Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-border-all text-indigo-400"></i>
        On-Chain Collection
      </h2>
      <div class="text-xs text-gray-400 font-mono">
        Total Items: <span id="loadedCount" class="text-white font-bold">0</span>
      </div>
    </div>

    <!-- NFT Grid -->
    <div id="nftGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

  </main>

  <footer class="border-t border-white/10 py-6 bg-black/40 text-center text-xs text-gray-500">
    High Speed On-Chain SVG & Metadata Fetcher
  </footer>

  <script>
    let allNFTs = [];
    let isFetching = false;

    function resolveUrl(url) {
      if (!url) return 'https://via.placeholder.com/400x400/111827/6B7280?text=No+Image';
      if (url.startsWith('ipfs://')) {
        return url.replace('ipfs://', 'https://ipfs.io/ipfs/');
      }
      return url;
    }

    async function startFetching() {
      if (isFetching) return;
      isFetching = true;

      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const contract = document.getElementById("contractInput").value.trim();
      
      const grid = document.getElementById("nftGrid");
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");
      const progressCount = document.getElementById("progressCount");
      const loadedCount = document.getElementById("loadedCount");

      grid.innerHTML = "";
      allNFTs = [];
      statusBox.classList.remove("hidden");
      
      let pageKey = null;

      try {
        do {
          let url = `https://eth-mainnet.g.alchemy.com/nft/v3/${apiKey}/getNFTsForContract?contractAddress=${contract}&withMetadata=true&limit=100`;
          if (pageKey) {
            url += `&pageKey=${pageKey}`;
          }

          statusText.innerText = `Fetching metadata batch... (${allNFTs.length} loaded)`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("API Connection Failed");

          const data = await res.json();
          const nfts = data.nfts || [];
          
          if (nfts.length === 0) break;

          allNFTs.push(...nfts);
          pageKey = data.pageKey;

          progressCount.innerText = `${allNFTs.length} Loaded`;
          loadedCount.innerText = allNFTs.length;
          
          // Render Batch Directly
          renderBatch(nfts);

        } while (pageKey && allNFTs.length < 10000);

        statusText.innerText = "All Collection Metadata Loaded Successfully!";
        progressBar.style.width = "100%";
        
        enableDownloadButtons();

      } catch (err) {
        console.error(err);
        statusText.innerText = "Error: " + err.message;
      } finally {
        isFetching = false;
      }
    }

    function renderBatch(nfts) {
      const grid = document.getElementById("nftGrid");

      nfts.forEach((nft) => {
        const tokenId = nft.tokenId || (allNFTs.indexOf(nft) + 1);
        const title = nft.name || nft.title || `#${tokenId}`;
        let imgUrl = nft.image?.cachedUrl || nft.image?.originalUrl || nft.raw?.metadata?.image;
        imgUrl = resolveUrl(imgUrl);

        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between p-3 transition duration-300";

        card.innerHTML = `
          <div class="relative aspect-square rounded-xl overflow-hidden bg-black/40 border border-white/5 flex items-center justify-center">
            <img src="${imgUrl}" 
                 alt="${title}"
                 loading="lazy"
                 class="w-full h-full object-contain" 
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x400/111827/6B7280?text=Load+Error';" />
            <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded-md border border-white/10 text-[10px] font-mono text-indigo-400 font-bold">
              #${tokenId}
            </div>
          </div>
          <div class="mt-3 px-1">
            <h3 class="font-bold text-white text-sm truncate">${title}</h3>
            <p class="text-[11px] text-gray-400 font-mono mt-0.5">Token ID: ${tokenId}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function enableDownloadButtons() {
      const imgBtn = document.getElementById("downloadImagesBtn");
      const jsonBtn = document.getElementById("downloadJsonBtn");

      imgBtn.disabled = false;
      imgBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-indigo-600 text-white hover:bg-indigo-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-indigo-500/20";

      jsonBtn.disabled = false;
      jsonBtn.className = "text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl bg-purple-600 text-white hover:bg-purple-500 cursor-pointer transition flex items-center gap-2 shadow-lg shadow-purple-500/20";
    }

    // High Speed SVG ZIP Downloader
    async function downloadImagesZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");
      const progressBar = document.getElementById("progressBar");

      statusText.innerText = "Extracting On-Chain SVG files into ZIP...";
      let total = allNFTs.length;

      for (let i = 0; i < total; i++) {
        const nft = allNFTs[i];
        const serialNumber = i + 1; // 1, 2, 3... Serial Number
        let imgUrl = nft.image?.cachedUrl || nft.image?.originalUrl || nft.raw?.metadata?.image;
        imgUrl = resolveUrl(imgUrl);

        try {
          if (imgUrl.startsWith('data:image/svg+xml;base64,')) {
            // Base64 Encoded On-Chain SVG
            const base64Data = imgUrl.replace('data:image/svg+xml;base64,', '');
            zip.file(`${serialNumber}.svg`, base64Data, { base64: true });
          } else if (imgUrl.startsWith('data:image/svg+xml;utf8,')) {
            // Plain UTF-8 SVG
            const svgContent = decodeURIComponent(imgUrl.replace('data:image/svg+xml;utf8,', ''));
            zip.file(`${serialNumber}.svg`, svgContent);
          } else {
            // Fetch Remote SVG/Image URL
            const res = await fetch(imgUrl);
            const blob = await res.blob();
            const ext = blob.type.includes('svg') ? 'svg' : 'png';
            zip.file(`${serialNumber}.${ext}`, blob);
          }
        } catch (e) {
          console.error(`Error adding item ${serialNumber}`, e);
        }

        let pct = Math.floor(((i + 1) / total) * 100);
        progressBar.style.width = pct + "%";
        statusText.innerText = `Packaging item ${serialNumber} of ${total}...`;
      }

      statusText.innerText = "Generating ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "OnChain_NFT_SVGs.zip");
      statusText.innerText = "SVG ZIP Downloaded Successfully!";
    }

    // High Speed JSON ZIP Downloader
    async function downloadMetadataZip() {
      const zip = new JSZip();
      const statusText = document.getElementById("statusText");

      statusText.innerText = "Packaging JSON Metadata into ZIP...";

      allNFTs.forEach((nft, index) => {
        const serialNumber = index + 1; // 1, 2, 3... Serial Number
        const metadata = nft.raw?.metadata || nft;
        const jsonContent = JSON.stringify(metadata, null, 2);
        zip.file(`${serialNumber}.json`, jsonContent);
      });

      statusText.innerText = "Generating Metadata ZIP File...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "NFT_Metadata_JSON.zip");
      statusText.innerText = "JSON ZIP Downloaded Successfully!";
    }

    // Auto load on start
    window.addEventListener("DOMContentLoaded", startFetching);
  </script>
</body>
</html>
