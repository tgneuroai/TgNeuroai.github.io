<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP Layer & Directory Tree Extractor</title>
    <!-- JSZip Library for client-side unzipping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; margin-top: 0; }
        
        .upload-card {
            background-color: #1e293b;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 650px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .upload-card:hover {
            background-color: #334155;
            border-color: #60a5fa;
        }
        input[type="file"] { display: none; }
        
        .output-box {
            background-color: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: none;
        }
        .output-header {
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }
        pre {
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>📁 ZIP Layer Extractor Web App</h1>
    <p>আপনার ZIP ফাইলটি এখানে আপলোড করুন এবং তাৎক্ষণিক লেয়ার ট্রি দেখুন</p>

    <!-- Upload Area -->
    <div class="upload-card" id="dropZone" onclick="document.getElementById('zipInput').click()">
        <div style="font-size: 40px; margin-bottom: 10px;">📦 ➔ 🌳</div>
        <div style="font-size: 18px; font-weight: bold; color: #e2e8f0;">এখানে ZIP ফাইল ড্রপ করুন অথবা ক্লিক করুন</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 5px;">১০০% ক্লায়েন্ট-সাইড পার্সিং (ফাইল সার্ভারে যাবে না)</div>
        <input type="file" id="zipInput" accept=".zip" />
    </div>

    <!-- Output Area -->
    <div class="output-box" id="outputBox">
        <div class="output-header">📊 Extracted Directory Layer Tree:</div>
        <pre id="treeOutput">প্রসেস হচ্ছে...</pre>
    </div>

    <script>
        const zipInput = document.getElementById('zipInput');
        const treeOutput = document.getElementById('treeOutput');
        const outputBox = document.getElementById('outputBox');

        zipInput.addEventListener('change', handleFile);

        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            outputBox.style.display = 'block';
            treeOutput.textContent = "⏳ ZIP ফাইল পার্স এবং লেয়ার এক্সট্রাক্ট করা হচ্ছে...";

            try {
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                // ১. ফাইল পাথগুলো এক্সট্রাক্ট করা
                const filePaths = Object.keys(contents.files).filter(path => !path.startsWith('__MACOSX'));

                // ২. অবজেক্ট ট্রি বিল্ডিং
                const treeObj = {};
                filePaths.forEach(path => {
                    const parts = path.split('/').filter(Boolean);
                    let current = treeObj;
                    parts.forEach((part, index) => {
                        if (!current[part]) {
                            current[part] = (index === parts.length - 1 && !path.endsWith('/')) ? null : {};
                        }
                        if (current[part] !== null) {
                            current = current[part];
                        }
                    });
                });

                // ৩. ভিজ্যুয়াল ট্রি জেনারেটর
                function generateAsciiTree(node, prefix = '') {
                    let result = '';
                    const keys = Object.keys(node);
                    keys.forEach((key, index) => {
                        const isLast = index === keys.length - 1;
                        const connector = isLast ? '┗━ ' : '┣━ ';
                        const childPrefix = isLast ? '   ' : '┃  ';
                        
                        const isFile = node[key] === null;
                        const icon = isFile ? '📄 ' : '📂 ';

                        result += prefix + connector + icon + key + '\n';

                        if (!isFile && node[key]) {
                            result += generateAsciiTree(node[key], prefix + childPrefix);
                        }
                    });
                    return result;
                }

                const treeText = "📦 " + file.name + "\n" + generateAsciiTree(treeObj);
                treeOutput.textContent = treeText;

            } catch (err) {
                treeOutput.textContent = "❌ জিপ ফাইলটি পার্স করতে সমস্যা হয়েছে: " + err.message;
            }
        }
    </script>
</body>
</html>
