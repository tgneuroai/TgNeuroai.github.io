<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Gallery · Color ASCII Art</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            gap: 30px;
        }

        /* NFT Card exact styling */
        .nft-card {
            background-color: #d4ff00;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 512px;
            height: 512px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .nft-card:hover {
            transform: scale(1.02);
        }

        #asciiContainer {
            background-color: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        #asciiArt {
            font-size: 10px;
            line-height: 1.15;
            white-space: pre;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            letter-spacing: 0.5px;
        }

        .nft-title {
            text-align: center;
            margin-top: 15px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 512px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .input-group input {
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            width: 130px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #d4ff00;
            box-shadow: 0 0 25px rgba(212, 255, 0, 0.1);
        }

        .btn-load {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: #d4ff00;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(212, 255, 0, 0.2);
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(212, 255, 0, 0.35);
        }

        .quick-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-links button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-links button:hover {
            background: rgba(212, 255, 0, 0.12);
            border-color: rgba(212, 255, 0, 0.3);
            color: #d4ff00;
        }

        .download-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }

        .btn-download {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4ff00, #b3db00);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download-png {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
        }

        #status-message {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
        }

        #status-message.success { color: #69db7c; }
        #status-message.error { color: #ff6b6b; }
        #status-message.loading { color: #d4ff00; }
    </style>
</head>
<body>

    <div class="nft-card" id="nftCardElement">
        <div id="asciiContainer">
            <pre id="asciiArt">⏳ Loading color ASCII art...</pre>
        </div>
        <div class="nft-title" id="nftTitle">✨ NFT #2</div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="nftNumber" value="2" min="1" step="1" placeholder="#">
            <button class="btn-load" id="loadBtn">⟳ Load</button>
        </div>

        <div class="quick-links">
            <button onclick="loadNFT(1)">#1</button>
            <button onclick="loadNFT(2)">#2</button>
            <button onclick="loadNFT(3)">#3</button>
            <button onclick="loadNFT(4)">#4</button>
            <button onclick="loadNFT(5)">#5</button>
            <button onclick="loadNFT(6)">#6</button>
            <button class="btn-random" onclick="loadRandom()">🎲 Random</button>
        </div>

        <div class="download-section">
            <button class="btn-download" id="downloadAsciiBtn">📋 Download ASCII (TXT)</button>
            <button class="btn-download btn-download-png" id="downloadPngBtn">🖼️ Download as PNG Card</button>
        </div>

        <div id="status-message">Ready · Enter a number</div>
    </div>

    <script>
        const BASE_URL = "https://ipfs.io/ipfs/bafybeifh2kk6nv5osnwlh7qvjunuowb3vgxaoaqfufxiocozdqdpqqkvnu/";
        let currentNFTNumber = 2;
        let currentAsciiLines = [];

        const nftTitle = document.getElementById('nftTitle');
        const nftNumberInput = document.getElementById('nftNumber');
        const loadBtn = document.getElementById('loadBtn');
        const statusMsg = document.getElementById('status-message');
        const asciiArt = document.getElementById('asciiArt');
        const downloadAsciiBtn = document.getElementById('downloadAsciiBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');

        const ASCII_CHARS = '@%#*+=-:. ';

        function isTransparent(r, g, b, a) {
            return a < 30;
        }

        // GENERATE COLORED ASCII DATA
        function generateAsciiData(imageData, width, height) {
            const data = imageData.data;
            const lines = [];
            const chars = ASCII_CHARS;

            for (let y = 0; y < height; y++) {
                const line = [];
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    if (isTransparent(r, g, b, a)) {
                        line.push({ char: ' ', color: 'transparent' });
                    } else {
                        const gray = (r + g + b) / 3;
                        const charIndex = Math.floor((gray / 255) * (chars.length - 1));
                        const char = chars[charIndex];
                        line.push({ char: char, color: `rgb(${r},${g},${b})` });
                    }
                }
                lines.push(line);
            }
            return lines;
        }

        function renderAsciiToHTML(lines) {
            let html = '';
            lines.forEach(line => {
                line.forEach(item => {
                    if (item.color === 'transparent') {
                        html += ' ';
                    } else {
                        html += `<span style="color: ${item.color}">${item.char}</span>`;
                    }
                });
                html += '\n';
            });
            return html;
        }

        function loadNFT(number) {
            if (!number || number < 1 || !Number.isInteger(number)) {
                statusMsg.textContent = '⚠️ Please enter a valid positive integer';
                statusMsg.className = 'error';
                return;
            }

            currentNFTNumber = number;
            statusMsg.textContent = `⏳ Loading #${number} ...`;
            statusMsg.className = 'loading';
            asciiArt.innerHTML = '⏳ Generating color ASCII...';
            nftTitle.textContent = `✨ NFT #${number}`;

            const imageUrl = `${BASE_URL}${number}.png`;

            fetch(imageUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Image not found');
                    return response.blob();
                })
                .then(blob => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(blob);

                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        let displayWidth = 50; 
                        let displayHeight = Math.floor(displayWidth * (img.height / img.width) * 0.5);

                        canvas.width = displayWidth;
                        canvas.height = displayHeight;

                        ctx.clearRect(0, 0, displayWidth, displayHeight);
                        ctx.drawImage(img, 0, 0, displayWidth, displayHeight);

                        const imageData = ctx.getImageData(0, 0, displayWidth, displayHeight);
                        currentAsciiLines = generateAsciiData(imageData, displayWidth, displayHeight);
                        
                        asciiArt.innerHTML = renderAsciiToHTML(currentAsciiLines);

                        statusMsg.textContent = `✓ #${number} loaded successfully`;
                        statusMsg.className = 'success';
                        nftNumberInput.value = number;

                        URL.revokeObjectURL(objectUrl);
                    };

                    img.onerror = function() {
                        statusMsg.textContent = `✗ Error processing #${number}`;
                        statusMsg.className = 'error';
                        asciiArt.innerHTML = '⚠️ Could not process image';
                        URL.revokeObjectURL(objectUrl);
                    };

                    img.src = objectUrl;
                })
                .catch(error => {
                    statusMsg.textContent = `✗ #${number} not found on IPFS`;
                    statusMsg.className = 'error';
                    asciiArt.innerHTML = '⚠️ Image not found';
                });
        }

        // DOWNLOAD AS PERFECT CARD PNG
        function downloadAsPNG() {
            if (!currentAsciiLines || currentAsciiLines.length === 0) {
                statusMsg.textContent = '⚠️ Please load an NFT first';
                statusMsg.className = 'error';
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const size = 600; // Perfect square card size
            canvas.width = size;
            canvas.height = size;

            // 1. Draw Card Background (#d4ff00)
            ctx.fillStyle = '#d4ff00';
            ctx.fillRect(0, 0, size, size);

            // 2. Setup Font Parameters for ASCII
            const numRows = currentAsciiLines.length;
            const numCols = currentAsciiLines[0].length;

            const fontSize = 11;
            const charWidth = 6.5; 
            const lineHeight = 12;

            ctx.font = `${fontSize}px 'Courier New', monospace`;
            ctx.textBaseline = 'top';

            const totalWidth = numCols * charWidth;
            const totalHeight = numRows * lineHeight;

            const startX = (size - totalWidth) / 2;
            const startY = (size - totalHeight) / 2 - 15;

            // 3. Render ASCII Grid Line by Line
            currentAsciiLines.forEach((line, rowIndex) => {
                const y = startY + (rowIndex * lineHeight);
                line.forEach((item, colIndex) => {
                    if (item.color !== 'transparent') {
                        const x = startX + (colIndex * charWidth);
                        ctx.fillStyle = item.color;
                        ctx.fillText(item.char, x, y);
                    }
                });
            });

            // 4. Draw Title at Bottom
            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`✨ NFT #${currentNFTNumber}`, size / 2, size - 45);

            // 5. Download PNG
            const link = document.createElement('a');
            link.download = `NFT_#${currentNFTNumber}_Card.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusMsg.textContent = `✓ Card Downloaded successfully!`;
            statusMsg.className = 'success';
        }

        function downloadAsciiTXT() {
            if (!currentAsciiLines || currentAsciiLines.length === 0) return;
            let plainText = '';
            currentAsciiLines.forEach(line => {
                line.forEach(item => plainText += item.char);
                plainText += '\n';
            });

            const blob = new Blob([plainText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `NFT_#${currentNFTNumber}_ASCII.txt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function loadRandom() {
            const randomNum = Math.floor(Math.random() * 10) + 1;
            loadNFT(randomNum);
        }

        loadBtn.addEventListener('click', () => loadNFT(parseInt(nftNumberInput.value)));
        downloadAsciiBtn.addEventListener('click', downloadAsciiTXT);
        downloadPngBtn.addEventListener('click', downloadAsPNG);

        window.addEventListener('load', () => loadNFT(2));
    </script>

</body>
</html>
