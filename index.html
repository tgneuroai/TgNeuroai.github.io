<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypnotic Wave ASCII NFT Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            gap: 25px;
        }

        /* 512x512 Square NFT Card */
        .nft-card {
            background-color: #0d0e15;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 512px;
            height: 512px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, background-color 0.2s ease;
        }

        .nft-card:hover {
            transform: scale(1.01);
        }

        #asciiContainer {
            background-color: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #asciiArt {
            font-size: 8px;
            line-height: 0.85;
            letter-spacing: -0.5px;
            white-space: pre;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-align: center;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 512px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .input-group input[type="number"], .input-group input[type="text"] {
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input[type="number"] {
            width: 110px;
        }

        .input-group input[type="text"] {
            width: 130px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 4px 12px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .input-group input:focus {
            border-color: #d4ff00;
            box-shadow: 0 0 25px rgba(212, 255, 0, 0.1);
        }

        .btn-load {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: #d4ff00;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(212, 255, 0, 0.2);
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(212, 255, 0, 0.35);
        }

        .quick-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-links button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-links button:hover {
            background: rgba(212, 255, 0, 0.12);
            border-color: rgba(212, 255, 0, 0.3);
            color: #d4ff00;
        }

        .download-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }

        .btn-download {
            padding: 14px 30px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4ff00, #b3db00);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download-png {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        #status-message {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
        }

        #status-message.success { color: #69db7c; }
        #status-message.error { color: #ff6b6b; }
        #status-message.loading { color: #d4ff00; }

        @media (max-width: 550px) {
            .nft-card {
                width: 320px;
                height: 320px;
            }
            #asciiArt {
                font-size: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="nft-card" id="nftCardElement">
        <div id="asciiContainer">
            <pre id="asciiArt">⏳ Loading Hypnotic Waves...</pre>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="nftNumber" value="2" min="1" step="1" placeholder="#">
            
            <div class="color-picker-wrapper">
                <input type="color" id="bgColorPicker" value="#0d0e15">
                <input type="text" id="bgColorInput" value="#0d0e15" placeholder="#0d0e15">
            </div>

            <button class="btn-load" id="loadBtn">⟳ Load</button>
        </div>

        <div class="quick-links">
            <button onclick="loadNFT(1)">#1</button>
            <button onclick="loadNFT(2)">#2</button>
            <button onclick="loadNFT(3)">#3</button>
            <button onclick="loadNFT(4)">#4</button>
            <button onclick="loadNFT(5)">#5</button>
            <button onclick="loadNFT(6)">#6</button>
            <button class="btn-random" onclick="loadRandom()">🎲 Random</button>
        </div>

        <div class="download-section">
            <button class="btn-download" id="downloadAsciiBtn">📋 Download ASCII (TXT)</button>
            <button class="btn-download btn-download-png" id="downloadPngBtn">🖼️ Download PNG Image</button>
        </div>

        <div id="status-message">Ready · Enter a number</div>
    </div>

    <script>
        const BASE_URL = "https://ipfs.io/ipfs/bafybeifh2kk6nv5osnwlh7qvjunuowb3vgxaoaqfufxiocozdqdpqqkvnu/";
        let currentNFTNumber = 2;
        let baseImageData = null;
        let animationFrameId = null;
        let frameCount = 0;
        let currentBgColor = "#0d0e15";

        const nftNumberInput = document.getElementById('nftNumber');
        const loadBtn = document.getElementById('loadBtn');
        const statusMsg = document.getElementById('status-message');
        const asciiArt = document.getElementById('asciiArt');
        const downloadAsciiBtn = document.getElementById('downloadAsciiBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const nftCardElement = document.getElementById('nftCardElement');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const bgColorInput = document.getElementById('bgColorInput');

        // Reference GIF Style Wave Pattern Symbol Sets & Color Gradients
        const PATTERN_CHARS = ['┼', '░', '▒', '▓', '║', '═', '╪', '┼', '╳', '•', '·'];
        const ASCII_SUBJECT = '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrftj1ijlnfiI1!i~;-:::... ';

        function updateBackgroundColor(color) {
            currentBgColor = color;
            nftCardElement.style.backgroundColor = color;
            bgColorPicker.value = color;
            bgColorInput.value = color;
        }

        bgColorPicker.addEventListener('input', (e) => updateBackgroundColor(e.target.value));
        bgColorInput.addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (/^#[0-9A-F]{6}$/i.test(val) || /^#[0-9A-F]{3}$/i.test(val)) {
                updateBackgroundColor(val);
            }
        });

        // SLOW & SMOOTH CONCENTRIC WAVE RENDER
        function renderWaveFrame(imageData, width, height, frame) {
            const data = imageData.data;
            let html = '';
            
            // Slow animation speed calculation (Divide by 8 for smooth motion)
            const slowTime = frame / 8;
            const centerX = width / 2;
            const centerY = height / 2;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    if (a < 30) {
                        // Math for Concentric/Radial Ripples spreading outwards smoothly
                        const dx = x - centerX;
                        const dy = (y - centerY) * 1.6; // Vertical stretch to match aspect ratio
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        // Smooth Sinusoidal Wave Formula matching reference GIF
                        const wave = Math.sin(distance * 0.28 - slowTime);
                        const patternIndex = Math.floor(((wave + 1) / 2) * (PATTERN_CHARS.length - 1));
                        const char = PATTERN_CHARS[patternIndex];

                        // Retro Gold/Teal Tint Cycle matching reference gif
                        const goldTone = Math.floor(180 + wave * 60);
                        const tealTone = Math.floor(130 - wave * 40);

                        html += `<span style="color: rgba(${goldTone}, ${tealTone}, 70, 0.75)">${char}</span>`;
                    } else {
                        // Main Character rendering with crisp standard pixel texture
                        const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                        const charIdx = Math.floor((gray / 255) * (ASCII_SUBJECT.length - 1));
                        const char = ASCII_SUBJECT[charIdx];

                        html += `<span style="color: rgb(${r},${g},${b})">${char}</span>`;
                    }
                }
                html += '\n';
            }
            return html;
        }

        // ANIMATION LOOP WITH FRAMERATE LIMITER FOR ULTRA-SMOOTH MOTION
        function startSlowWaveAnimation(imageData, width, height) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function animate() {
                frameCount++;
                asciiArt.innerHTML = renderWaveFrame(imageData, width, height, frameCount);
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function loadNFT(number) {
            if (!number || number < 1 || !Number.isInteger(number)) {
                statusMsg.textContent = '⚠️ সঠিক একটি সংখ্যা দিন';
                statusMsg.className = 'error';
                return;
            }

            currentNFTNumber = number;
            statusMsg.textContent = `⏳ লোড হচ্ছে #${number} ...`;
            statusMsg.className = 'loading';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            asciiArt.innerHTML = '⏳ লোড হচ্ছে Hypnotic Waves...';

            const imageUrl = `${BASE_URL}${number}.png`;

            fetch(imageUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Image not found');
                    return response.blob();
                })
                .then(blob => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(blob);

                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        let displayWidth = 85; 
                        let displayHeight = Math.floor(displayWidth * (img.height / img.width) * 0.58);

                        canvas.width = displayWidth;
                        canvas.height = displayHeight;

                        ctx.clearRect(0, 0, displayWidth, displayHeight);
                        ctx.drawImage(img, 0, 0, displayWidth, displayHeight);

                        baseImageData = ctx.getImageData(0, 0, displayWidth, displayHeight);
                        
                        startSlowWaveAnimation(baseImageData, displayWidth, displayHeight);

                        statusMsg.textContent = `✓ #${number} স্লো স্মুথ পেটার্ন এনিমেশন তৈরি হয়েছে!`;
                        statusMsg.className = 'success';
                        nftNumberInput.value = number;

                        URL.revokeObjectURL(objectUrl);
                    };

                    img.onerror = function() {
                        statusMsg.textContent = `✗ ইমেজ প্রসেস করতে সমস্যা হয়েছে #${number}`;
                        statusMsg.className = 'error';
                        asciiArt.innerHTML = '⚠️ Image error';
                        URL.revokeObjectURL(objectUrl);
                    };

                    img.src = objectUrl;
                })
                .catch(error => {
                    statusMsg.textContent = `✗ #${number} IPFS-এ পাওয়া যায়নি`;
                    statusMsg.className = 'error';
                    asciiArt.innerHTML = '⚠️ Image not found';
                });
        }

        // DOWNLOAD PNG
        function downloadAsPNG() {
            if (!baseImageData) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const imageSize = 512;
            canvas.width = imageSize;
            canvas.height = imageSize;

            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, imageSize, imageSize);

            const link = document.createElement('a');
            link.download = `NFT_#${currentNFTNumber}_Wave_Frame.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadAsciiTXT() {
            if (!asciiArt.innerText) return;
            const blob = new Blob([asciiArt.innerText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `NFT_#${currentNFTNumber}_Wave.txt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function loadRandom() {
            const randomNum = Math.floor(Math.random() * 10) + 1;
            loadNFT(randomNum);
        }

        loadBtn.addEventListener('click', () => loadNFT(parseInt(nftNumberInput.value)));
        downloadAsciiBtn.addEventListener('click', downloadAsciiTXT);
        downloadPngBtn.addEventListener('click', downloadAsPNG);

        window.addEventListener('load', () => {
            updateBackgroundColor('#0d0e15');
            loadNFT(2);
        });
    </script>

</body>
</html>
