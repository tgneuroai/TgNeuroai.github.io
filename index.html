<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DystoPunks — প্রিমিয়াম NFT গ্যালারি</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #070b10;
            color: #eef2f8;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(30, 60, 120, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(60, 30, 120, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 20, 40, 0.8) 0%, #070b10 100%);
            padding: 0;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1620; }
        ::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4ff00; }

        .container { max-width: 1600px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-left { display: flex; align-items: center; gap: 1.2rem; }
        .logo-icon {
            width: 52px; height: 52px;
            background: #d4ff00;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #070b10;
            box-shadow: 0 8px 30px rgba(212, 255, 0, 0.2);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 30%, #d4ff00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }
        .header-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #8aa3c9;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .header-stats .stat-item i { color: #d4ff00; font-size: 0.9rem; }
        .header-stats .stat-item .num { color: #fff; font-weight: 600; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 400px;
        }
        .search-box:focus-within {
            border-color: #d4ff00;
            box-shadow: 0 0 30px rgba(212, 255, 0, 0.08);
            background: rgba(255, 255, 255, 0.07);
        }
        .search-box input {
            background: transparent;
            border: none;
            padding: 0.7rem 0.8rem;
            color: #eef2f8;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            font-family: inherit;
        }
        .search-box input::placeholder { color: #4a6385; }
        .search-box button {
            background: #d4ff00;
            border: none;
            color: #070b10;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .search-box button:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(212, 255, 0, 0.3); }

        .filter-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-tags .tag {
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8aa3c9;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .filter-tags .tag:hover { background: rgba(212, 255, 0, 0.15); border-color: #d4ff00; color: #fff; }
        .filter-tags .tag.active { background: rgba(212, 255, 0, 0.2); border-color: #d4ff00; color: #fff; }

        .download-btns {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .download-btn {
            background: #d4ff00;
            border: none;
            color: #070b10;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .download-btn:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(212, 255, 0, 0.3); }
        .download-btn.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #eef2f8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .download-btn.secondary:hover { background: rgba(212, 255, 0, 0.15); border-color: #d4ff00; color: #fff; }

        .progress-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            height: 4px;
            margin-bottom: 0.8rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #d4ff00;
            border-radius: 40px;
            transition: width 0.4s ease;
        }
        .progress-text {
            text-align: right;
            font-size: 0.75rem;
            color: #5a7395;
            margin-bottom: 1.8rem;
            letter-spacing: 0.3px;
        }

        .nft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .nft-card {
            background: linear-gradient(145deg, rgba(20, 30, 45, 0.9), rgba(12, 18, 28, 0.95));
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            position: relative;
            cursor: pointer;
        }
        .nft-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(212, 255, 0, 0.2), transparent, rgba(212, 255, 0, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .nft-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(212, 255, 0, 0.4);
            box-shadow: 0 20px 60px rgba(212, 255, 0, 0.2);
        }

        .media-wrapper {
            background: #d4ff00;
            position: relative;
            padding-top: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-wrapper canvas, .media-wrapper video, .media-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #d4ff00;
            image-rendering: pixelated;
        }
        .media-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #d4ff00;
            border: 1px solid rgba(212, 255, 0, 0.2);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
        }

        .nft-info {
            padding: 1.2rem 1.3rem 1.4rem;
            background: linear-gradient(180deg, rgba(18, 26, 38, 0.9), rgba(12, 18, 28, 0.95));
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nft-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #eef2f8;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nft-name .token-id {
            font-size: 0.7rem;
            font-weight: 500;
            color: #5a7395;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .attributes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.4rem;
            margin-top: 0.2rem;
        }
        .trait {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #b6cdff;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            letter-spacing: 0.2px;
        }
        .trait-type { color: #6a84aa; font-weight: 400; }
        .trait-value { color: #dce8ff; font-weight: 500; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.6rem;
            color: #5a7395;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .card-footer .download-single {
            background: rgba(212, 255, 0, 0.1);
            border: 1px solid rgba(212, 255, 0, 0.2);
            color: #d4ff00;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .card-footer .download-single:hover { background: #d4ff00; color: #070b10; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 14, 0.85);
            backdrop-filter: blur(16px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s ease;
            padding: 1.5rem;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-container {
            background: linear-gradient(145deg, #121a26, #0a0f18);
            border: 1px solid rgba(212, 255, 0, 0.3);
            border-radius: 28px;
            width: 100%;
            max-width: 900px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8), 0 0 50px rgba(212, 255, 0, 0.15);
            transform: scale(0.9) translateY(20px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.25s ease;
        }
        .modal-close:hover { background: #d4ff00; color: #070b10; transform: rotate(90deg); }
        
        .modal-media {
            flex: 1.1;
            background: #d4ff00;
            min-height: 400px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-media canvas, .modal-media video, .modal-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .modal-details {
            flex: 1;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.5rem;
        }
        .modal-header h2 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 0.4rem;
        }
        .modal-header .modal-badge-id {
            display: inline-block;
            background: rgba(212, 255, 0, 0.15);
            border: 1px solid #d4ff00;
            color: #d4ff00;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .modal-traits-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a84aa;
            margin-bottom: 0.8rem;
        }
        .modal-traits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .modal-trait-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
        }
        .modal-trait-card .type { font-size: 0.65rem; color: #6a84aa; text-transform: uppercase; }
        .modal-trait-card .val { font-size: 0.85rem; color: #fff; font-weight: 600; margin-top: 2px; }

        .modal-actions { display: flex; gap: 0.8rem; margin-top: 1rem; }
        .modal-download-btn {
            flex: 1;
            background: #d4ff00;
            color: #070b10;
            border: none;
            padding: 0.8rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .modal-download-btn:hover { box-shadow: 0 6px 25px rgba(212, 255, 0, 0.35); transform: translateY(-2px); }

        .loading-placeholder {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: #5a7395;
        }
        .loading-placeholder .spinner {
            display: inline-block;
            width: 44px; height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top-color: #d4ff00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .nft-card { animation: fadeUp 0.5s ease forwards; }

        @media (max-width: 850px) {
            .modal-container { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .modal-media { min-height: 280px; }
            .modal-details { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-left">
            <div class="logo-icon"><i class="fas fa-cube"></i></div>
            <h1>DystoPunks</h1>
        </div>
        <div class="header-stats">
            <span class="stat-item"><i class="fas fa-image"></i> <span class="num" id="totalCount">0</span> / 2076</span>
            <span class="stat-item"><i class="fas fa-film"></i> <span class="num" id="gifCount">0</span> GIF</span>
            <span class="stat-item"><i class="fas fa-file-image"></i> <span class="num" id="pngCount">0</span> PNG</span>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="NFT খুঁজুন..." />
            <button id="searchBtn"><i class="fas fa-arrow-right"></i></button>
        </div>
        <div class="filter-tags">
            <button class="tag active" data-filter="all">সব</button>
            <button class="tag" data-filter="gif">🎞️ GIF</button>
            <button class="tag" data-filter="png">🖼️ PNG</button>
        </div>
        <div class="download-btns">
            <button class="download-btn" id="downloadImagesBtn"><i class="fas fa-download"></i> PNG জিপ</button>
            <button class="download-btn secondary" id="downloadMetadataBtn"><i class="fas fa-download"></i> JSON জিপ</button>
        </div>
    </div>

    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</div>

    <div id="nftGrid" class="nft-grid">
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <div class="main-text">NFT গুলো লোড হচ্ছে</div>
            <div class="sub-text">মেটাডাটা থেকে ছবি আনা হচ্ছে...</div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="nftModal">
    <div class="modal-container">
        <div class="modal-close" id="modalClose"><i class="fas fa-times"></i></div>
        <div class="modal-media" id="modalMedia"></div>
        <div class="modal-details">
            <div>
                <div class="modal-header">
                    <span class="modal-badge-id" id="modalTokenId">#0</span>
                    <h2 id="modalName">DystoPunk</h2>
                </div>
                <div style="margin-top: 1.5rem;">
                    <div class="modal-traits-title"><i class="fas fa-sliders-h"></i> অ্যাট্রিবিউট সমূহ</div>
                    <div class="modal-traits-grid" id="modalTraitsGrid"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-download-btn" id="modalDownloadBtn"><i class="fas fa-download"></i> #d4ff00 ব্যাকগ্রাউন্ড সহ ডাউনলোড</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const TOTAL = 2076;
        const BASE_URL = 'https://dystopunks.mypinata.cloud/ipfs/QmeYQ2eDCcJpfBQHq59P7SNevQR2ycEfctn6waw8fZBJhK/';
        const CONCURRENCY = 10;

        const grid = document.getElementById('nftGrid');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const totalCount = document.getElementById('totalCount');
        const gifCount = document.getElementById('gifCount');
        const pngCount = document.getElementById('pngCount');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const filterTags = document.querySelectorAll('.filter-tags .tag');
        const downloadImagesBtn = document.getElementById('downloadImagesBtn');
        const downloadMetadataBtn = document.getElementById('downloadMetadataBtn');

        const modal = document.getElementById('nftModal');
        const modalClose = document.getElementById('modalClose');
        const modalMedia = document.getElementById('modalMedia');
        const modalTokenId = document.getElementById('modalTokenId');
        const modalName = document.getElementById('modalName');
        const modalTraitsGrid = document.getElementById('modalTraitsGrid');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');

        let allCards = [];
        let allNFTData = [];
        let gifTotal = 0;
        let pngTotal = 0;
        let currentFilter = 'all';
        let searchQuery = '';
        let activeModalItem = null;

        function getExtension(url) {
            if (!url) return '';
            try {
                const path = new URL(url).pathname;
                const parts = path.split('.');
                return parts.length > 1 ? parts.pop().toLowerCase() : '';
            } catch {
                const match = url.match(/\.([^./?#]+)(?:[?#]|$)/);
                return match ? match[1].toLowerCase() : '';
            }
        }

        function getModifiedCanvas(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;

                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = img.width;
                    offCanvas.height = img.height;
                    const offCtx = offCanvas.getContext('2d');
                    offCtx.drawImage(img, 0, 0);

                    const imgData = offCtx.getImageData(0, 0, img.width, img.height);
                    const data = imgData.data;

                    const bgR = data[0], bgG = data[1], bgB = data[2];

                    ctx.fillStyle = '#d4ff00';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.drawImage(img, 0, 0);
                    const targetData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const td = targetData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                        const isBg = Math.abs(r - bgR) < 22 && Math.abs(g - bgG) < 22 && Math.abs(b - bgB) < 22;

                        if (isBg || a < 50) {
                            td[i] = 212;
                            td[i+1] = 255;
                            td[i+2] = 0;
                            td[i+3] = 255;
                        }
                    }
                    ctx.putImageData(targetData, 0, 0);
                    resolve(canvas);
                };
                img.onerror = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400; canvas.height = 400;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#d4ff00';
                    ctx.fillRect(0, 0, 400, 400);
                    resolve(canvas);
                };
                img.src = imageUrl;
            });
        }

        function createMediaElement(imageUrl, tokenId, format) {
            const wrapper = document.createElement('div');
            wrapper.className = 'media-wrapper';

            if (format === 'gif') {
                const video = document.createElement('video');
                video.src = imageUrl;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.setAttribute('crossorigin', 'anonymous');
                video.style.background = '#d4ff00';
                wrapper.appendChild(video);

                const badge = document.createElement('div');
                badge.className = 'media-badge';
                badge.innerHTML = '<i class="fas fa-play"></i> GIF';
                wrapper.appendChild(badge);
            } else {
                const canvas = document.createElement('canvas');
                wrapper.appendChild(canvas);
                getModifiedCanvas(imageUrl).then(renderedCanvas => {
                    canvas.width = renderedCanvas.width;
                    canvas.height = renderedCanvas.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(renderedCanvas, 0, 0);
                });
            }
            return wrapper;
        }

        function renderAttrs(attrs) {
            if (!attrs || attrs.length === 0) {
                return `<span class="trait"><span class="trait-type">—</span> <span class="trait-value">কোনো বৈশিষ্ট্য নেই</span></span>`;
            }
            return attrs.slice(0, 6).map(a => {
                return `<span class="trait"><span class="trait-type">${a.trait_type || 'বৈশিষ্ট্য'}:</span> <span class="trait-value">${a.value || '—'}</span></span>`;
            }).join('');
        }

        function fetchAndBuildCard(index) {
            const tokenId = index + 1;
            const url = `${BASE_URL}${tokenId}`;

            return fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    const imageUrl = data.image || '';
                    const name = data.name || `DystoPunk #${tokenId}`;
                    const attrs = data.attributes || [];
                    const ext = getExtension(imageUrl);
                    const format = ext === 'gif' ? 'gif' : 'png';

                    const card = document.createElement('div');
                    card.className = 'nft-card';

                    const media = createMediaElement(imageUrl, tokenId, format);
                    card.appendChild(media);

                    const info = document.createElement('div');
                    info.className = 'nft-info';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'nft-name';
                    nameDiv.innerHTML = `${name} <span class="token-id">#${tokenId}</span>`;
                    info.appendChild(nameDiv);

                    const attrDiv = document.createElement('div');
                    attrDiv.className = 'attributes';
                    attrDiv.innerHTML = renderAttrs(attrs);
                    info.appendChild(attrDiv);

                    const footer = document.createElement('div');
                    footer.className = 'card-footer';
                    const formatLabel = format === 'gif' ? 'GIF' : 'PNG';
                    const formatIcon = format === 'gif' ? 'fa-film' : 'fa-file-image';
                    footer.innerHTML = `
                        <span class="format"><i class="fas ${formatIcon}"></i> ${formatLabel}</span>
                        <button class="download-single"><i class="fas fa-download"></i> ডাউনলোড</button>
                    `;
                    info.appendChild(footer);
                    card.appendChild(info);

                    const itemData = {
                        tokenId: tokenId,
                        name: name,
                        format: format,
                        attributes: attrs,
                        imageUrl: imageUrl,
                        metadata: data
                    };

                    card.addEventListener('click', () => openModal(itemData));

                    const downloadBtn = card.querySelector('.download-single');
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        downloadSingleNFT(itemData);
                    });

                    return { element: card, ...itemData };
                })
                .catch(() => {
                    const fallback = document.createElement('div');
                    fallback.className = 'nft-card';
                    fallback.innerHTML = `
                        <div class="media-wrapper" style="background:#d4ff00; display:flex; align-items:center; justify-content:center; color:#070b10;">
                            <i class="fas fa-exclamation-triangle" style="font-size:2rem; opacity:0.3;"></i>
                        </div>
                        <div class="nft-info"><div class="nft-name">DystoPunk #${tokenId}</div></div>
                    `;
                    return { element: fallback, tokenId, format: 'error', imageUrl: '', metadata: null };
                });
        }

        function openModal(item) {
            activeModalItem = item;
            modalTokenId.textContent = `#${item.tokenId}`;
            modalName.textContent = item.name;

            modalMedia.innerHTML = '';
            const mediaElem = createMediaElement(item.imageUrl, item.tokenId, item.format);
            modalMedia.appendChild(mediaElem);

            modalTraitsGrid.innerHTML = '';
            if (item.attributes && item.attributes.length > 0) {
                item.attributes.forEach(attr => {
                    const box = document.createElement('div');
                    box.className = 'modal-trait-card';
                    box.innerHTML = `
                        <div class="type">${attr.trait_type || 'Trait'}</div>
                        <div class="val">${attr.value || '—'}</div>
                    `;
                    modalTraitsGrid.appendChild(box);
                });
            } else {
                modalTraitsGrid.innerHTML = '<div style="color:#6a84aa; font-size:0.8rem;">কোনো বৈশিষ্ট্য নেই</div>';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
            activeModalItem = null;
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        async function downloadSingleNFT(item) {
            const canvas = await getModifiedCanvas(item.imageUrl);
            canvas.toBlob((blob) => {
                saveAs(blob, `${item.tokenId}.png`);
                if (item.metadata) {
                    const metaBlob = new Blob([JSON.stringify(item.metadata, null, 2)], {type: 'application/json'});
                    saveAs(metaBlob, `${item.tokenId}.json`);
                }
            }, 'image/png');
        }

        modalDownloadBtn.addEventListener('click', () => {
            if (activeModalItem) downloadSingleNFT(activeModalItem);
        });

        function applyFilters() {
            const query = searchQuery.toLowerCase().trim();
            const filter = currentFilter;
            let visibleCount = 0, visibleGif = 0, visiblePng = 0;

            allCards.forEach(item => {
                const card = item.element;
                const format = item.format;
                const nameMatch = (item.name || '').toLowerCase().includes(query) || String(item.tokenId).includes(query);
                const formatMatch = filter === 'all' || filter === format;
                const show = nameMatch && formatMatch;
                card.style.display = show ? 'flex' : 'none';
                if (show) {
                    visibleCount++;
                    if (format === 'gif') visibleGif++;
                    else if (format === 'png') visiblePng++;
                }
            });

            progressText.innerHTML = `
                <i class="fas fa-eye"></i> ${visibleCount} টি দেখানো হচ্ছে 
                <span style="color:#4a6385; margin-left:0.5rem;">(GIF: ${visibleGif} · PNG: ${visiblePng})</span>
            `;
        }

        async function loadAll() {
            const placeholder = grid.querySelector('.loading-placeholder');
            if (placeholder) placeholder.remove();

            let loaded = 0;

            for (let i = 0; i < TOTAL; i += CONCURRENCY) {
                const end = Math.min(i + CONCURRENCY, TOTAL);
                const batchPromises = [];

                for (let j = i; j < end; j++) {
                    batchPromises.push(fetchAndBuildCard(j));
                }

                const results = await Promise.allSettled(batchPromises);

                for (const result of results) {
                    if (result.status === 'fulfilled') {
                        const cardData = result.value;
                        allCards.push(cardData);
                        allNFTData.push(cardData);
                        grid.appendChild(cardData.element);
                        if (cardData.format === 'gif') gifTotal++;
                        else if (cardData.format === 'png') pngTotal++;
                    }
                    loaded++;
                }

                const percent = Math.min(100, Math.round((loaded / TOTAL) * 100));
                progressBar.style.width = percent + '%';
                progressText.innerHTML = `
                    <i class="fas fa-spinner fa-spin"></i> ${loaded} / ${TOTAL} লোড হয়েছে 
                    <span style="color:#4a6385; margin-left:0.5rem;">(GIF: ${gifTotal} · PNG: ${pngTotal})</span>
                `;
                totalCount.textContent = loaded;
                gifCount.textContent = gifTotal;
                pngCount.textContent = pngTotal;
            }

            progressBar.style.width = '100%';
            progressText.innerHTML = `
                <i class="fas fa-check-circle" style="color:#d4ff00;"></i> ✅ ${TOTAL} / ${TOTAL} গ্যালারি লোড সম্পন্ন!
            `;
            applyFilters();
        }

        // ====== আলাদা জিপ ডাউনলোড: PNG এবং JSON ======
        async function downloadImagesZip() {
            if (allNFTData.length === 0) return;
            const zip = new JSZip();
            let count = 0;

            downloadImagesBtn.disabled = true;
            downloadImagesBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> রেন্ডার হচ্ছে...';

            for (const item of allNFTData) {
                if (item.format === 'error' || !item.imageUrl) continue;
                try {
                    const canvas = await getModifiedCanvas(item.imageUrl);
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    zip.file(`${item.tokenId}.png`, blob);
                    count++;
                } catch (err) {
                    console.warn(`#${item.tokenId} PNG রেন্ডার ব্যর্থ`);
                }
            }

            try {
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'DystoPunks_Images.zip');
                alert(`✅ ${count} টি PNG ডাউনলোড হয়েছে!`);
            } catch (err) {
                alert('ZIP তৈরিতে ব্যর্থ।');
            }

            downloadImagesBtn.disabled = false;
            downloadImagesBtn.innerHTML = '<i class="fas fa-download"></i> PNG জিপ';
        }

        async function downloadMetadataZip() {
            if (allNFTData.length === 0) return;
            const zip = new JSZip();
            let count = 0;

            downloadMetadataBtn.disabled = true;
            downloadMetadataBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> প্রস্তুত হচ্ছে...';

            for (const item of allNFTData) {
                if (item.metadata) {
                    zip.file(`${item.tokenId}.json`, JSON.stringify(item.metadata, null, 2));
                    count++;
                }
            }

            try {
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'DystoPunks_Metadata.zip');
                alert(`✅ ${count} টি JSON মেটাডাটা ডাউনলোড হয়েছে!`);
            } catch (err) {
                alert('ZIP তৈরিতে ব্যর্থ।');
            }

            downloadMetadataBtn.disabled = false;
            downloadMetadataBtn.innerHTML = '<i class="fas fa-download"></i> JSON জিপ';
        }

        downloadImagesBtn.addEventListener('click', downloadImagesZip);
        downloadMetadataBtn.addEventListener('click', downloadMetadataZip);

        function handleSearch() {
            searchQuery = searchInput.value;
            applyFilters();
        }

        searchInput.addEventListener('input', handleSearch);
        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });

        filterTags.forEach(tag => {
            tag.addEventListener('click', function() {
                filterTags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });

        loadAll().catch(err => {
            console.error('গ্লোবাল এরর:', err);
        });

    })();
</script>

</body>
</html>
