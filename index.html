<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Color ASCII Art Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            flex-direction: column;
            gap: 30px;
        }

        /* NFT Card design */
        .nft-card {
            background-color: #d4ff00;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: auto;
            max-width: 90vw;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .nft-card:hover {
            transform: scale(1.01);
        }

        #asciiContainer {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            box-sizing: border-box;
        }

        #asciiArt {
            font-size: 6px; /* High density character sizing */
            line-height: 0.9;
            letter-spacing: 0px;
            white-space: pre;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .nft-title {
            text-align: center;
            margin-top: 20px;
            color: #1a1a2e;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 1.5px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 550px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .input-group input {
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            width: 130px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #d4ff00;
            box-shadow: 0 0 25px rgba(212, 255, 0, 0.1);
        }

        .btn-load {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: #d4ff00;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(212, 255, 0, 0.2);
        }

        .btn-load:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(212, 255, 0, 0.35);
        }

        .quick-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-links button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-links button:hover {
            background: rgba(212, 255, 0, 0.12);
            border-color: rgba(212, 255, 0, 0.3);
            color: #d4ff00;
        }

        .download-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }

        .btn-download {
            padding: 14px 30px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #d4ff00, #b3db00);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download-png {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        #status-message {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            text-align: center;
        }

        #status-message.success { color: #69db7c; }
        #status-message.error { color: #ff6b6b; }
        #status-message.loading { color: #d4ff00; }
    </style>
</head>
<body>

    <div class="nft-card" id="nftCardElement">
        <div id="asciiContainer">
            <pre id="asciiArt">⏳ High Quality Color ASCII Art তৈরি হচ্ছে...</pre>
        </div>
        <div class="nft-title" id="nftTitle">✨ NFT #2</div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="nftNumber" value="2" min="1" step="1" placeholder="#">
            <button class="btn-load" id="loadBtn">⟳ Load</button>
        </div>

        <div class="quick-links">
            <button onclick="loadNFT(1)">#1</button>
            <button onclick="loadNFT(2)">#2</button>
            <button onclick="loadNFT(3)">#3</button>
            <button onclick="loadNFT(4)">#4</button>
            <button onclick="loadNFT(5)">#5</button>
            <button onclick="loadNFT(6)">#6</button>
            <button class="btn-random" onclick="loadRandom()">🎲 Random</button>
        </div>

        <div class="download-section">
            <button class="btn-download" id="downloadAsciiBtn">📋 Download ASCII (TXT)</button>
            <button class="btn-download btn-download-png" id="downloadPngBtn">🖼️ Download Full Card PNG</button>
        </div>

        <div id="status-message">Ready · Enter a number</div>
    </div>

    <script>
        const BASE_URL = "https://ipfs.io/ipfs/bafybeifh2kk6nv5osnwlh7qvjunuowb3vgxaoaqfufxiocozdqdpqqkvnu/";
        let currentNFTNumber = 2;
        let currentAsciiLines = [];
        let originalImgWidth = 512;
        let originalImgHeight = 512;

        const nftTitle = document.getElementById('nftTitle');
        const nftNumberInput = document.getElementById('nftNumber');
        const loadBtn = document.getElementById('loadBtn');
        const statusMsg = document.getElementById('status-message');
        const asciiArt = document.getElementById('asciiArt');
        const downloadAsciiBtn = document.getElementById('downloadAsciiBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');

        // ছবির সূক্ষ্ম ডিটেইলসের জন্য প্রসারিত ASCII characters র‍্যাম্প
        const ASCII_CHARS = '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrftj1ijlnfiI1!i~;-:::...   ';

        function isTransparent(r, g, b, a) {
            return a < 30;
        }

        // GENERATE HIGH-DENSITY COLORED ASCII DATA
        function generateAsciiData(imageData, width, height) {
            const data = imageData.data;
            const lines = [];
            const chars = ASCII_CHARS;

            for (let y = 0; y < height; y++) {
                const line = [];
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    if (isTransparent(r, g, b, a)) {
                        line.push({ char: ' ', color: 'transparent' });
                    } else {
                        // Luminance Calculation
                        const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                        const charIndex = Math.floor((gray / 255) * (chars.length - 1));
                        const char = chars[charIndex];
                        line.push({ char: char, color: `rgb(${r},${g},${b})` });
                    }
                }
                lines.push(line);
            }
            return lines;
        }

        function renderAsciiToHTML(lines) {
            let html = '';
            lines.forEach(line => {
                line.forEach(item => {
                    if (item.color === 'transparent') {
                        html += ' ';
                    } else {
                        html += `<span style="color: ${item.color}">${item.char}</span>`;
                    }
                });
                html += '\n';
            });
            return html;
        }

        function loadNFT(number) {
            if (!number || number < 1 || !Number.isInteger(number)) {
                statusMsg.textContent = '⚠️ সঠিক একটি সংখ্যা ইনপুট দিন';
                statusMsg.className = 'error';
                return;
            }

            currentNFTNumber = number;
            statusMsg.textContent = `⏳ লোড হচ্ছে #${number} ...`;
            statusMsg.className = 'loading';
            asciiArt.innerHTML = '⏳ লোড হচ্ছে High Density ASCII...';
            nftTitle.textContent = `✨ NFT #${number}`;

            const imageUrl = `${BASE_URL}${number}.png`;

            fetch(imageUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Image not found');
                    return response.blob();
                })
                .then(blob => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(blob);

                    img.onload = function() {
                        originalImgWidth = img.width;
                        originalImgHeight = img.height;

                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        // হাই রেゾল্যুশন ডিটেইলস এর জন্য কলাম সংখ্যা ১০০-১২০ রাখা হয়েছে
                        let displayWidth = 110; 
                        // Monospace ফন্টের উচ্চতা মেলানোর জন্য ০.৫৫ দিয়ে গুণ
                        let displayHeight = Math.floor(displayWidth * (img.height / img.width) * 0.55);

                        canvas.width = displayWidth;
                        canvas.height = displayHeight;

                        ctx.clearRect(0, 0, displayWidth, displayHeight);
                        ctx.drawImage(img, 0, 0, displayWidth, displayHeight);

                        const imageData = ctx.getImageData(0, 0, displayWidth, displayHeight);
                        currentAsciiLines = generateAsciiData(imageData, displayWidth, displayHeight);
                        
                        asciiArt.innerHTML = renderAsciiToHTML(currentAsciiLines);

                        statusMsg.textContent = `✓ #${number} সফলভাবে প্রস্তুত করা হয়েছে!`;
                        statusMsg.className = 'success';
                        nftNumberInput.value = number;

                        URL.revokeObjectURL(objectUrl);
                    };

                    img.onerror = function() {
                        statusMsg.textContent = `✗ চিত্র প্রক্রিয়াকরণে ত্রুটি হয়েছে #${number}`;
                        statusMsg.className = 'error';
                        asciiArt.innerHTML = '⚠️ Image conversion failed';
                        URL.revokeObjectURL(objectUrl);
                    };

                    img.src = objectUrl;
                })
                .catch(error => {
                    statusMsg.textContent = `✗ #${number} IPFS-এ পাওয়া যায়নি`;
                    statusMsg.className = 'error';
                    asciiArt.innerHTML = '⚠️ Image not found';
                });
        }

        // DOWNLOAD FULL-CARD HIGH RESOLUTION PNG
        function downloadAsPNG() {
            if (!currentAsciiLines || currentAsciiLines.length === 0) {
                statusMsg.textContent = '⚠️ প্রথমে একটি NFT লোড করুন';
                statusMsg.className = 'error';
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // অরিজিনাল আর্টের ইমেজের আকার অনুযায়ী ক্যানভাস সাইজ
            const cardWidth = 800;
            const cardHeight = Math.floor(cardWidth * (originalImgHeight / originalImgWidth)) + 120;

            canvas.width = cardWidth;
            canvas.height = cardHeight;

            // ১. ব্যাকগ্রাউন্ড ব্রাইট কার্ড কালার (#d4ff00)
            ctx.fillStyle = '#d4ff00';
            ctx.fillRect(0, 0, cardWidth, cardHeight);

            // ২. ASCII টেক্সট প্যারামিটার সেটআপ
            const numRows = currentAsciiLines.length;
            const numCols = currentAsciiLines[0].length;

            const fontSize = 8;
            const charWidth = 5.2; 
            const lineHeight = 7.2;

            ctx.font = `900 ${fontSize}px 'Courier New', monospace`;
            ctx.textBaseline = 'top';

            const totalAsciiWidth = numCols * charWidth;
            const totalAsciiHeight = numRows * lineHeight;

            // সেন্টার পজিশনিং লজিক
            const startX = (cardWidth - totalAsciiWidth) / 2;
            const startY = (cardHeight - totalAsciiHeight - 60) / 2;

            // ৩. টেক্সট গ্রিড ক্যানভাসে রেন্ডারিং
            currentAsciiLines.forEach((line, rowIndex) => {
                const y = startY + (rowIndex * lineHeight);
                line.forEach((item, colIndex) => {
                    if (item.color !== 'transparent') {
                        const x = startX + (colIndex * charWidth);
                        ctx.fillStyle = item.color;
                        ctx.fillText(item.char, x, y);
                    }
                });
            });

            // ৪. নিচে টাইটেল বসানো
            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`✨ NFT #${currentNFTNumber}`, cardWidth / 2, cardHeight - 60);

            // ৫. ফাইল ডাউনলোড
            const link = document.createElement('a');
            link.download = `NFT_#${currentNFTNumber}_ASCII_Card.png`;
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusMsg.textContent = `✓ বড় হাই-কোয়ালিটি কার্ড ডাউনলোড সম্পূর্ণ হয়েছে!`;
            statusMsg.className = 'success';
        }

        function downloadAsciiTXT() {
            if (!currentAsciiLines || currentAsciiLines.length === 0) return;
            let plainText = '';
            currentAsciiLines.forEach(line => {
                line.forEach(item => plainText += item.char);
                plainText += '\n';
            });

            const blob = new Blob([plainText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `NFT_#${currentNFTNumber}_ASCII.txt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function loadRandom() {
            const randomNum = Math.floor(Math.random() * 10) + 1;
            loadNFT(randomNum);
        }

        loadBtn.addEventListener('click', () => loadNFT(parseInt(nftNumberInput.value)));
        downloadAsciiBtn.addEventListener('click', downloadAsciiTXT);
        downloadPngBtn.addEventListener('click', downloadAsPNG);

        window.addEventListener('load', () => loadNFT(2));
    </script>

</body>
</html>
